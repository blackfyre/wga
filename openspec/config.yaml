schema: spec-driven

context: |
  Prefer the smallest coherent change that satisfies the specification.
  Do not include implementation details in artifacts unless they materially constrain the solution.
  Do not add unrelated refactors, cleanup, or speculative features to a change.

rules:
  proposal:
    - Keep the proposal concise; state the problem, intended outcome, scope, and important non-goals.
  design:
    - Record only consequential technical decisions and tradeoffs; omit obvious implementation narration.
    - When alternatives matter, include at most two credible alternatives.
  tasks:
    - Make each task independently verifiable and small enough for one focused implementation session when practical.
    - Split cross-cutting umbrella tasks into bounded units with clear completion conditions.
    - Include deterministic verification in the relevant task when the required check is not obvious from the repository.

operations:
  apply:
    guidance:
      - Work one unchecked task at a time unless two tasks are inseparable.
      - Read only task-relevant artifacts and code before broadening context.
      - Run focused deterministic checks before marking a task complete.
      - Do not mark a task complete when required verification is failing.
      - Retry the same implementation failure at most twice; then leave the task unchecked and report the blocker.
      - Avoid unrelated refactors and opportunistic cleanup.
  archive:
    guidance:
      - Archive only after all intended tasks are complete and no known critical verification issue remains.
      - Keep the archive summary concise.
