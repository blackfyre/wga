# Dependabot version updates for every ecosystem the application ships, builds or develops with.
# Commit prefixes produce Conventional Commit PR titles accepted by pr-validation.yml.
# Security updates are grouped separately so they are not held back by routine bumps.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
      bun-production:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
        patterns: ["*"]
      bun-development:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy/otel-collector"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
      include: "scope"
