name: Playwright Tests
# The workflow runs for every push and pull request so the ci-gate check is
# always reported; the changes job skips the heavy jobs when no code changed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - "**/*.go"
              - "**/*.js"
              - "**/*.ts"
              - "**/*.templ"
              - "**/*.pcss"
              - "internal/licences/**"
              - "internal/assets/views/open-source-licences.html"
              - ".github/workflows/playwright.yml"
              - "package.json"
              - "bun.lock"
              - "go.mod"
              - "go.sum"
              - "mise.toml"
              - ".golangci.yml"

  format:
    # Checks Prettier formatting of the JS and Markdown files a change touches,
    # on every push and pull request (documentation-only changes included).
    # It fails instead of committing fixes: run `bunx prettier --write` locally.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting of changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            echo "No comparison base; nothing to check."
            exit 0
          fi
          git diff --name-only --diff-filter=ACMR -z "$base"...HEAD -- '*.js' '*.md' \
            | xargs -0 -r bunx prettier --check

  backend-quality-gates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Transpile Frontend
        run: bun run build
      - name: Compile templates
        run: go tool templ generate
      - name: Verify committed licence notices
        run: go test ./cmd/generate-licences -run '^TestCommittedNoticesMatchManifest$'
      - name: Generate licence notices and SBOM
        run: go run ./cmd/generate-licences
      - name: Install go modules
        run: go mod tidy
      - name: Run go vet
        run: go vet ./...
      - name: Run go tests
        run: go test ./... -cover
      - name: Build the application
        run: go build -v -o ./out/wga ./cmd/wga
      - uses: actions/upload-artifact@v4
        with:
          name: wga-binary
          path: out/wga
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: wga-sbom
          path: dist/wga.cdx.json
          retention-days: 1

  lint:
    # Runs the third-party lint action with a read-only token.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Transpile Frontend
        run: bun run build
      - name: Compile templates
        run: go tool templ generate
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  build:
    needs: [backend-quality-gates, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: playwright
    steps:
      - name: Fetch the application binary
        uses: actions/download-artifact@v4
        with:
          name: wga-binary
          path: ./out
      - name: Set executable permissions
        run: chmod +x ./wga
        working-directory: ./out
      - name: Run migrations
        run: ./wga migrate
        working-directory: ./out
        env:
          WGA_ENV: test
          WGA_PROTOCOL: http
          WGA_HOSTNAME: localhost:8090
          WGA_ADMIN_EMAIL: some.random.email@local.host
          WGA_ADMIN_PASSWORD: VerySecurePassword
          WGA_SMTP_HOST: 127.0.0.1
          WGA_SMTP_PORT: "1025"
          WGA_SMTP_USERNAME: ""
          WGA_SMTP_PASSWORD: ""
          WGA_SENDER_ADDRESS: do-not-reply@wga.hu
          WGA_SENDER_NAME: WGA
          MAILPIT_URL: http://127.0.0.1:8025
          WGA_POSTCARD_TOKEN_KEYS: '{"test":"MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE"}'
          WGA_POSTCARD_TOKEN_ACTIVE_KEY_ID: test
      - uses: actions/upload-artifact@v4
        with:
          name: wga
          path: out
          retention-days: 1
  playwright-tests:
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    runs-on: ubuntu-latest
    environment: playwright
    env:
      WGA_PROTOCOL: http
      WGA_HOSTNAME: 127.0.0.1:8090
    steps:
      - uses: actions/checkout@v4
      - name: Set up bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Fetch the build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wga
          path: ./wga_tmp
      - name: Download Mailpit
        run: wget -q -O mailpit-linux-amd64.tar.gz https://github.com/axllent/mailpit/releases/download/v1.30.4/mailpit-linux-amd64.tar.gz
      - name: Verify Mailpit archive
        run: echo "e9c104154c22b83ac4c7d19f9d665a5c933585a3caafcd790805d732fa8d03fb  mailpit-linux-amd64.tar.gz" | sha256sum --check --status
      - name: Extract Mailpit
        run: tar -xvf mailpit-linux-amd64.tar.gz
      - name: Run Mailpit
        run: ./mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025 --log-file mailpit.log &
      - name: Wait for Mailpit
        run: for i in {1..30}; do curl --fail --silent --show-error http://127.0.0.1:8025/readyz && exit 0; sleep 1; done; exit 1
      - name: Install Bun dependencies
        run: bun install
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_ENV"
      # - name: Cache playwright binaries
      #   uses: actions/cache@v4
      #   id: playwright-cache
      #   with:
      #     path: |
      #       ~/.cache/ms-playwright
      #     key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Make apt resilient to slow mirrors
        # Playwright's --with-deps calls apt-get as root. A stalled mirror
        # connection used to hang it until the job timed out, and killing the
        # wrapper left apt-get holding the dpkg lock. Let apt itself time out
        # and retry stalled downloads, and wait for the lock instead of failing.
        run: |
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "300";' \
            | sudo tee /etc/apt/apt.conf.d/99-wga-ci >/dev/null
      - name: Install Playwright Chromium
        # The suite runs only the chromium project, so install that browser and
        # its system packages once.
        timeout-minutes: 12
        run: bunx playwright install --with-deps chromium
      - name: Add executable permissions
        run: chmod +x ./wga
        working-directory: ./wga_tmp
      - name: Run the application
        run: |
          nohup ./wga serve > wga.log 2>&1 &
          echo $! > wga.pid
        working-directory: ./wga_tmp
        env:
          WGA_ENV: test
          WGA_ADMIN_EMAIL: some.random.email@local.host
          WGA_ADMIN_PASSWORD: VerySecurePassword
          WGA_SMTP_HOST: 127.0.0.1
          WGA_SMTP_PORT: "1025"
          WGA_SMTP_USERNAME: ""
          WGA_SMTP_PASSWORD: ""
          WGA_SENDER_ADDRESS: do-not-reply@wga.hu
          WGA_SENDER_NAME: WGA
          MAILPIT_URL: http://127.0.0.1:8025
          WGA_POSTCARD_TOKEN_KEYS: '{"test":"MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE"}'
          WGA_POSTCARD_TOKEN_ACTIVE_KEY_ID: test
          # One runner client executes every spec; production keeps 3 per hour.
          WGA_ITINERARY_DRAFT_BUDGET: "1000"
          WGA_ITINERARY_PUBLISH_BUDGET: "1000"
      - name: Wait for the application to start
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/; then
              exit 0
            fi
            if ! kill -0 "$(cat wga.pid)" 2>/dev/null; then
              cat wga.log
              exit 1
            fi
            sleep 1
          done
          cat wga.log
          exit 1
        working-directory: ./wga_tmp
      - name: Run Playwright tests
        run: bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          MAILPIT_URL: http://127.0.0.1:8025
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailpit-${{ matrix.shardIndex }}
          path: mailpit.log
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wga-log-${{ matrix.shardIndex }}
          path: wga_tmp/wga.log
          retention-days: 1
  merge-reports:
    # Merge reports after playwright-tests, even if some shards have failed
    if: >-
      ${{
        always() &&
        (needs.playwright-tests.result == 'success' ||
         needs.playwright-tests.result == 'failure')
      }}
    needs: [playwright-tests]
    environment: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14

  ci-gate:
    # The single required status check. It passes when no code changed (the
    # gated jobs are skipped) and otherwise only when every gated job succeeded.
    if: always()
    needs:
      [changes, format, backend-quality-gates, lint, build, playwright-tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check gated job results
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "code changed: ${CODE_CHANGED:-unknown}; results: ${RESULTS}"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes job did not succeed." >&2; exit 1
          fi
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped)
                if [ "$CODE_CHANGED" = "true" ]; then
                  echo "A gated job was skipped although code changed." >&2
                  exit 1
                fi
                ;;
              *) echo "A gated job finished with: $result" >&2; exit 1 ;;
            esac
          done
          echo "All gated jobs passed."
