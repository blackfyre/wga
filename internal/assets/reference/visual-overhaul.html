is tour has not yet been rebuilt page by page. It stays published exactly as it was written, for the screens available at the time, and its bibliography is printed at the foot of that version. Nothing has been withdrawn — the rebuild is a matter of layout, not of content.<\u002Fp>\n                <\u002Fdiv>\n                <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ gtStartStyle }}\" style-hover=\"opacity:0.85;\" sc-camel-on-click=\"{{ gtStart }}\">{{ gtStartLabel }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);margin-top:26px;\">{{ gtUpdated }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- text page -->\n            <sc-if value=\"{{ gtIsText }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px;\">\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">{{ gtSectionLabel }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ gtPageDateline }}<\u002Fdiv>\n                <\u002Fdiv>\n                <h1 style=\"{{ gtPageTitleStyle }}\">{{ gtPageTitle }}<\u002Fh1>\n                <sc-for list=\"{{ gtParas }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <p style=\"font-size:17px;line-height:1.78;color:var(--text, #2a2822);margin:0 0 22px;max-width:66ch;text-wrap:pretty;\">{{ p.text }}<\u002Fp>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- picture page -->\n            <sc-if value=\"{{ gtIsPicture }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"{{ gtPicPlateStyle }}\" sc-camel-on-click=\"{{ gtPicZoom }}\">\n                  <div style=\"{{ gtPicImgStyle }}\"><\u002Fdiv>\n                  <span style=\"position:absolute;left:12px;bottom:12px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ gtPicLabel }}<\u002Fspan>\n                  <span style=\"position:absolute;right:12px;bottom:12px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;background:var(--ink, #1C1C1A);color:var(--bg, #F4F2ED);padding:5px 8px;pointer-events:none;\">CLICK TO ZOOM<\u002Fspan>\n                <\u002Fdiv>\n                <h1 style=\"{{ gtPageTitleStyle }}\">{{ gtPageTitle }}<\u002Fh1>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;line-height:1.7;color:var(--muted, #6B6660);margin:-10px 0 24px;\">{{ gtPicCredit }}<\u002Fdiv>\n                <sc-for list=\"{{ gtParas }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <p style=\"font-size:17px;line-height:1.78;color:var(--text, #2a2822);margin:0 0 22px;max-width:66ch;text-wrap:pretty;\">{{ p.text }}<\u002Fp>\n                <\u002Fsc-for>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ gtPicOpen }}\">OPEN THE FULL RECORD →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- index page -->\n            <sc-if value=\"{{ gtIsList }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px;\">\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">{{ gtSectionLabel }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ gtPageDateline }}<\u002Fdiv>\n                <\u002Fdiv>\n                <h1 style=\"{{ gtPageTitleStyle }}\">{{ gtPageTitle }}<\u002Fh1>\n                <p style=\"font-size:16px;line-height:1.7;color:var(--text-2, #4a463f);margin:-8px 0 26px;max-width:62ch;text-wrap:pretty;\">{{ gtListIntro }}<\u002Fp>\n                <div style=\"border-top:1px solid var(--ink, #1C1C1A);\">\n                  <sc-for list=\"{{ gtListRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n                    <div style=\"{{ row.style }}\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ row.onClick }}\">\n                      <div style=\"font-size:16px;font-weight:600;line-height:1.3;\">{{ row.name }}<\u002Fdiv>\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">{{ row.dates }}<\u002Fdiv>\n                      <div style=\"font-size:14px;line-height:1.55;color:var(--text-2, #4a463f);\">{{ row.note }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- sources page -->\n            <sc-if value=\"{{ gtIsSources }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:14px;\">END OF THE TOUR<\u002Fdiv>\n                <h1 style=\"{{ gtPageTitleStyle }}\">Sources<\u002Fh1>\n                <p style=\"font-size:16px;line-height:1.7;color:var(--text-2, #4a463f);margin:-8px 0 26px;max-width:62ch;text-wrap:pretty;\">What this tour was written from. Attributions follow the literature below; where it disagrees with itself, the tour says so on the page rather than picking a side quietly.<\u002Fp>\n                <div style=\"border-top:1px solid var(--ink, #1C1C1A);\">\n                  <sc-for list=\"{{ gtSources }}\" as=\"src\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ src.style }}\">\n                      <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--faint, #8a857c);\">{{ src.n }}<\u002Fspan>\n                      <span style=\"font-size:14px;line-height:1.65;color:var(--text-2, #4a463f);\">{{ src.text }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);margin-top:26px;\">{{ gtUpdated }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"{{ gtFootStyle }}\">\n              <div style=\"{{ gtBackStyle }}\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ gtBack }}\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:5px;\">← BACK<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;line-height:1.3;\">{{ gtBackLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ gtOnStyle }}\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ gtOn }}\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--accent, #003366);margin-bottom:5px;\">NEXT PAGE →<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;line-height:1.3;\">{{ gtOnLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ gtEndStyle }}\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ gtEnd }}\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--accent, #003366);margin-bottom:5px;\">ON TO {{ gtEndNo }} →<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;line-height:1.3;\">{{ gtEndLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ITINERARIES INDEX ================= -->\n    <sc-if value=\"{{ isItineraries }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Itineraries\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">16&nbsp;—&nbsp;VISITOR&nbsp;ITINERARIES<\u002Fdiv>\n        <div style=\"{{ itinHeadStyle }}\">\n          <div style=\"flex:1;min-width:0;\">\n            <h1 style=\"{{ pageTitleFlushStyle }}\">Itineraries<\u002Fh1>\n            <p style=\"max-width:560px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:14px 0 0;\">Sequences of up to fifteen works, chosen and annotated by visitors. Separate from the <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToGuidedTours }}\">Guided Tours<\u002Fspan>, which are written by the editors, run to chapters, and are kept in revision indefinitely.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"{{ itinCtaBtnStyle }}\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ goToItinBuild }}\">BUILD AN ITINERARY →<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ itinRulesStyle }}\">\n          <sc-for list=\"{{ itinRules }}\" as=\"rule\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:7px;\">{{ rule.label }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;color:var(--text, #2a2822);\">{{ rule.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--muted, #6B6660);\">{{ itinPublicCount }}&nbsp;LISTED&nbsp;PUBLICLY<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">NEWEST&nbsp;FIRST<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ itinPublic }}\" as=\"it\" hint-placeholder-count=\"5\">\n          <div data-kbd-idx=\"{{ it.kbdIdx }}\" tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ it.rowStyle }}\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ it.onClick }}\">\n            <span style=\"{{ it.caretStyle }}\">▸<\u002Fspan>\n            <div style=\"min-width:0;\">\n              <div style=\"font-size:17px;font-weight:600;line-height:1.3;\">{{ it.title }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;color:var(--muted, #6B6660);margin-top:4px;\">{{ it.note }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ it.creator }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ it.stopLabel }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ it.duration }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--faint, #8a857c);\">{{ it.date }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"margin-top:56px;padding-top:22px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));max-width:560px;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">UNLISTED ITINERARIES<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">Makers can keep an itinerary off this page. Unlisted ones stay reachable by their link and are not counted above, but they are purged on the same schedule.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ITINERARY BUILDER ================= -->\n    <sc-if value=\"{{ isItinBuild }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Itinerary Builder\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:32px;\">\n          <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToItineraries }}\">ITINERARIES<\u002Fspan>&nbsp;&nbsp;/&nbsp;&nbsp;NEW&nbsp;DRAFT\n        <\u002Fdiv>\n        <div style=\"{{ itinHeadStyle }}\">\n          <div style=\"flex:1;min-width:0;\">\n            <h1 style=\"{{ pageTitleFlushStyle }}\">Build an itinerary<\u002Fh1>\n            <p style=\"max-width:520px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:14px 0 0;\">Add works, put them in the order you want them seen, and write the narration that goes with each one.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"{{ itinCounterStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:26px;letter-spacing:-0.5px;\">{{ itinCount }}&nbsp;/&nbsp;15<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-top:6px;\">WORKS&nbsp;·&nbsp;{{ itinDuration }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ itinFieldRowStyle }}\">\n          <div style=\"flex:1;min-width:0;\">\n            <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">TITLE OF THE ITINERARY<\u002Flabel>\n            <input value=\"{{ itinTitle }}\" sc-camel-on-change=\"{{ setItinTitle }}\" placeholder=\"e.g. Five rooms, one window\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:9px 0;font-size:17px;font-family:inherit;outline:none;\">\n          <\u002Fdiv>\n          <div style=\"{{ itinNameFieldStyle }}\">\n            <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">SHOWN AS THE MAKER<\u002Flabel>\n            <input value=\"{{ itinCreator }}\" sc-camel-on-change=\"{{ setItinCreator }}\" placeholder=\"A name or Anon.\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:9px 0;font-size:17px;font-family:inherit;outline:none;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:0 0 28px;\">\n          <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">INTRODUCTION — SHOWN BEFORE THE FIRST WORK, {{ itinIntroLeft }} CHARACTERS LEFT<\u002Flabel>\n          <textarea value=\"{{ itinIntro }}\" sc-camel-on-change=\"{{ setItinIntro }}\" placeholder=\"What holds these works together, and what you want a visitor to notice.\" style=\"width:100%;border:1px solid var(--rule-4, rgba(28,28,26,0.3));background:transparent;padding:12px;font-size:15px;font-family:inherit;line-height:1.55;outline:none;min-height:80px;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">WORKS&nbsp;IN&nbsp;THIS&nbsp;ITINERARY<\u002Fdiv>\n          <div style=\"{{ itinPickerToggleStyle }}\" sc-camel-on-click=\"{{ toggleItinPicker }}\">{{ itinPickerLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ itinPickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ itinPickerPanelStyle }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:14px;margin-bottom:18px;\">\n              <input value=\"{{ itinPickerQuery }}\" sc-camel-on-change=\"{{ setItinPickerQuery }}\" placeholder=\"Search the collection by title or artist\" style=\"{{ itinPickerSearchStyle }}\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ itinPickerCount }}&nbsp;SHOWN<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ itinPickerGridStyle }}\">\n              <sc-for list=\"{{ itinPickerResults }}\" as=\"work\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                  <div style=\"width:34px;height:42px;flex-shrink:0;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));overflow:hidden;\"><div style=\"{{ work.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;\">\n                    <div style=\"font-size:14px;font-weight:600;line-height:1.3;\">{{ work.title }}<\u002Fdiv>\n                    <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--muted, #6B6660);margin-top:3px;\">{{ work.artist }},&nbsp;{{ work.date }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ work.addStyle }}\" sc-camel-on-click=\"{{ work.add }}\">{{ work.addLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ itinPickerEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);padding:8px 0 4px;\">Nothing in the collection matches that. Try an artist surname.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"{{ itinBuildLayoutStyle }}\">\n          <aside style=\"{{ itinFilmstripStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);padding-bottom:10px;\">ORDER&nbsp;OF&nbsp;PRESENTATION<\u002Fdiv>\n            <sc-for list=\"{{ itinStops }}\" as=\"stop\" hint-placeholder-count=\"3\">\n              <div style=\"{{ stop.rowStyle }}\" sc-camel-on-click=\"{{ stop.select }}\">\n                <div style=\"{{ stop.indexStyle }}\">{{ stop.index }}<\u002Fdiv>\n                <div style=\"{{ stop.thumbStyle }}\"><\u002Fdiv>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ stop.title }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:{{ stop.stateColor }};margin-top:4px;letter-spacing:0.5px;\">{{ stop.stateLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex-shrink:0;\">\n                  <div style=\"{{ stop.upStyle }}\" sc-camel-on-click=\"{{ stop.moveUp }}\">↑<\u002Fdiv>\n                  <div style=\"{{ stop.downStyle }}\" sc-camel-on-click=\"{{ stop.moveDown }}\">↓<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--faint, #8a857c);cursor:pointer;padding:2px 4px;flex-shrink:0;transition:color 0.16s ease;\" style-hover=\"color:var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ stop.remove }}\">✕<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ itinEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px dashed var(--rule-4, rgba(28,28,26,0.3));padding:26px 20px;text-align:center;\">\n                <div style=\"font-size:14px;line-height:1.6;color:var(--text-2, #4a463f);\">No works yet. Add them above, or use <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToArtworks }}\">artwork search<\u002Fspan> and collect as you browse.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Faside>\n\n          <div style=\"flex:1;min-width:0;\">\n            <sc-if value=\"{{ itinHasStops }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">STOP&nbsp;{{ activeIndex }}&nbsp;OF&nbsp;{{ itinCount }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ activeSchool }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"{{ itinEditorLayoutStyle }}\">\n                  <div style=\"{{ itinEditorPlateStyle }}\">\n                    <div style=\"{{ activeImgStyle }}\"><\u002Fdiv>\n                    <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:0.5px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ activeTitle }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;\">\n                    <h2 style=\"font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:-0.2px;line-height:1.2;\">{{ activeTitle }}<\u002Fh2>\n                    <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-bottom:22px;\">{{ activeArtist }},&nbsp;{{ activeDate }}<\u002Fdiv>\n                    <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">YOUR NARRATION — {{ activeNarrationLeft }} CHARACTERS LEFT<\u002Flabel>\n                    <textarea value=\"{{ activeNarration }}\" sc-camel-on-change=\"{{ setActiveNarration }}\" placeholder=\"What should a visitor look at here, and why does it follow the work before it?\" style=\"width:100%;border:1px solid var(--rule-4, rgba(28,28,26,0.3));background:transparent;padding:12px;font-size:15px;font-family:inherit;line-height:1.6;outline:none;min-height:160px;resize:vertical;\"><\u002Ftextarea>\n                    <div style=\"display:flex;justify-content:space-between;gap:16px;margin-top:10px;\">\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:0.5px;color:var(--faint, #8a857c);\">{{ activeWordCount }}<\u002Fdiv>\n                      <div style=\"{{ nextStopStyle }}\" sc-camel-on-click=\"{{ selectNextStop }}\">{{ nextStopLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ itinEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:56px 0;border-top:1px solid var(--ink, #1C1C1A);\">\n                <div style=\"font-size:18px;font-weight:600;margin-bottom:8px;\">Nothing to narrate yet.<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);max-width:400px;\">Pick a first work above. Fifteen is the ceiling; most itineraries read best at five or six.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ itinPublishBarStyle }}\">\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">WHO CAN FIND IT<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;\">\n              <sc-for list=\"{{ itinVisibility }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:var(--text-2, #4a463f);max-width:520px;\">{{ itinVisibilityNote }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.8;color:var(--faint, #8a857c);margin-top:16px;max-width:520px;\">ITINERARIES ARE KEPT FOR ONE YEAR FROM THE DAY THEY ARE PUBLISHED, THEN DELETED. PUBLISHING IS FINAL — THERE IS NO ACCOUNT AND NO EDIT LINK, SO CHECK THE ORDER AND THE NARRATION BEFORE YOU SEND IT.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ itinPublishActionsStyle }}\">\n            <button style=\"{{ itinPublishBtnStyle }}\" sc-camel-on-click=\"{{ publishItinerary }}\">{{ itinPublishLabel }}<\u002Fbutton>\n            <button style=\"background:transparent;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:border-color 0.16s ease;\" style-hover=\"border:1px solid var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ previewItinerary }}\">PREVIEW SLIDESHOW<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ITINERARY PUBLISHED ================= -->\n    <sc-if value=\"{{ isItinShare }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Itinerary Published\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">18&nbsp;—&nbsp;ITINERARY&nbsp;PUBLISHED<\u002Fdiv>\n        <div style=\"width:44px;height:44px;border:1.5px solid var(--accent, #003366);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:var(--accent, #003366);font-size:18px;margin:14px 0 24px;\">✓<\u002Fdiv>\n        <h1 style=\"{{ pageTitleStyle }}\">{{ itinShareTitle }}<\u002Fh1>\n        <p style=\"max-width:520px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 44px;\">The link below is the only way back to it. Copy it somewhere safe before you close this page.<\u002Fp>\n\n        <div style=\"{{ itinShareLinkStyle }}\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;color:var(--text, #2a2822);word-break:break-all;line-height:1.6;flex:1;min-width:0;\">{{ itinShareUrl }}<\u002Fdiv>\n          <div style=\"{{ itinCopyStyle }}\" sc-camel-on-click=\"{{ copyItinLink }}\">{{ itinCopyLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ itinShareMetaStyle }}\">\n          <sc-for list=\"{{ itinShareMeta }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"{{ row.style }}\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">{{ row.label }}<\u002Fspan>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:{{ row.color }};\">{{ row.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ itinShareActionsStyle }}\">\n          <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:none;padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ openItinViewer }}\">OPEN THE SLIDESHOW →<\u002Fbutton>\n          <button style=\"background:transparent;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:border-color 0.16s ease;\" style-hover=\"border:1px solid var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ goToItineraries }}\">ALL ITINERARIES<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:48px;padding-top:20px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));max-width:520px;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">ONE YEAR FROM TODAY<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">On {{ itinExpiry }} the itinerary and its narration are deleted and the link stops working. The works themselves stay in the archive at their own addresses.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <footer style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding:40px 0 60px;\">\n      <div style=\"{{ footerGridStyle }}\">\n        <div>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;margin-bottom:12px;\">WEB&nbsp;GALLERY&nbsp;OF&nbsp;ART<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:var(--muted, #6B6660);max-width:280px;\">A searchable archive of European fine art, decorative art and architecture, 3rd century to the early 20th. Open source, maintained by contributors.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">BROWSE<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToArtists }}\">Artists<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToArtworks }}\">Artworks<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToTimeline }}\">Timeline<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToTours }}\">Inspiration<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToGuidedTours }}\">Guided tours<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToItineraries }}\">Itineraries<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToGlossary }}\">Glossary<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">SERVICES<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToPostcardCompose }}\">Postcards<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:2.1;color:var(--muted, #6B6660);\">Period music<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToDual }}\">Dual mode<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToGuestbook }}\">Guestbook<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">ABOUT<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToStatic }}\">Privacy policy<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToAbout }}\">About the collection<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToStats }}\">Statistics<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToContributors }}\">Contributors<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:2.1;color:var(--muted, #6B6660);\">Open-source licences<\u002Fdiv>\n          <div style=\"{{ footerLinkStyle }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ openCookieSettings }}\">Cookie settings<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:2.1;color:var(--muted, #6B6660);\">Contact<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--faint, #8a857c);margin-top:32px;letter-spacing:0.5px;\">© WEB GALLERY OF ART, CREATED BY EMIL KRÉN AND DANIEL MARX — DESIGN CONCEPT PROTOTYPE · IMAGES SHOWN AS PLACEHOLDERS<\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ trayVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ trayStyle }}\">\n      <div style=\"{{ trayInnerStyle }}\">\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;color:var(--faint, #8a857c);margin-bottom:6px;\">ITINERARY&nbsp;DRAFT&nbsp;·&nbsp;{{ itinCount }}&nbsp;OF&nbsp;15<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--inv-fg, #F4F2ED);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ trayNames }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ trayThumbsStyle }}\">\n          <sc-for list=\"{{ trayThumbs }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"{{ t.style }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-shrink:0;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--faint, #8a857c);cursor:pointer;padding:11px 4px;transition:color 0.16s ease;\" style-hover=\"color:var(--inv-fg, #F4F2ED);\" sc-camel-on-click=\"{{ clearTray }}\">CLEAR<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;background:var(--bg, #F4F2ED);color:var(--ink, #1C1C1A);padding:11px 16px;cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.82;\" sc-camel-on-click=\"{{ goToItinBuild }}\">ARRANGE &amp; NARRATE →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isItinView }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Itinerary Slideshow\" style=\"{{ viewerStyle }}\">\n      <div style=\"{{ viewerStageStyle }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-shrink:0;\">\n          <div style=\"min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;color:var(--muted, #7d786f);margin-bottom:7px;\">VISITOR&nbsp;ITINERARY<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;color:var(--inv-fg, #EFEDE7);line-height:1.3;\">{{ viewerTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;color:var(--muted, #7d786f);cursor:pointer;padding:2px 4px;transition:color 0.16s ease;flex-shrink:0;\" style-hover=\"color:var(--inv-fg, #EFEDE7);\" sc-camel-on-click=\"{{ closeViewer }}\">✕&nbsp;CLOSE<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div tabindex=\"0\" role=\"button\" aria-label=\"Open this reproduction in the image viewer\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ viewerPlateStyle }}\" sc-camel-on-click=\"{{ openViewerPlate }}\">\n          <div style=\"{{ viewerImgStyle }}\"><\u002Fdiv>\n          <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--text-2, #5c5850);text-transform:uppercase;text-align:center;\">IMAGE — {{ viewerWorkTitle }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"flex-shrink:0;\">\n          <div style=\"{{ viewerTicksStyle }}\">\n            <sc-for list=\"{{ viewerTicks }}\" as=\"tick\" hint-placeholder-count=\"5\">\n              <div style=\"{{ tick.style }}\" sc-camel-on-click=\"{{ tick.onClick }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;\">\n            <div style=\"{{ viewerPrevStyle }}\" sc-camel-on-click=\"{{ viewerPrev }}\">← PREVIOUS<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #7d786f);\">{{ viewerPosition }}<\u002Fdiv>\n            <div style=\"{{ viewerNextStyle }}\" sc-camel-on-click=\"{{ viewerNext }}\">{{ viewerNextLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <aside style=\"{{ viewerPanelStyle }}\">\n        <div>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;color:var(--muted, #7d786f);margin-bottom:16px;\">STOP&nbsp;{{ viewerStopNumber }}<\u002Fdiv>\n          <h2 style=\"{{ viewerWorkTitleStyle }}\">{{ viewerWorkTitle }}<\u002Fh2>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--faint-2, #9a958c);line-height:1.7;margin-bottom:26px;\">{{ viewerWorkArtist }},&nbsp;{{ viewerWorkDate }}<br>{{ viewerWorkSchool }}&nbsp;SCHOOL<\u002Fdiv>\n          <p style=\"{{ viewerNarrationStyle }}\">{{ viewerNarration }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid rgba(239,237,231,0.16);padding-top:16px;margin-top:32px;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;color:var(--muted, #7d786f);line-height:1.9;\">NARRATION&nbsp;BY&nbsp;{{ viewerCreator }}<br>{{ viewerKeyHint }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  {{ plateGallery }}\n\n  <sc-if value=\"{{ showViewportSwitch }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"{{ viewportSwitchStyle }}\">\n      <div style=\"display:flex;gap:1px;background:var(--rule-2, rgba(28,28,26,0.2));\">\n        <sc-for list=\"{{ frameOptions }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"{{ f.style }}\" sc-camel-on-click=\"{{ f.onClick }}\">{{ f.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;color:var(--muted, #6B6660);white-space:nowrap;\">{{ viewportLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"{{ feedbackFabStyle }}\" sc-camel-on-click=\"{{ openFeedback }}\">FEEDBACK<\u002Fdiv>\n\n  <sc-if value=\"{{ feedbackOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ modalScrimStyle }}\" sc-camel-on-click=\"{{ closeFeedback }}\">\n      <div style=\"{{ modalStyle }}\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">FEEDBACK<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:600;letter-spacing:-0.2px;\">{{ feedbackHeading }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px;color:var(--muted, #6B6660);cursor:pointer;padding:2px 4px;transition:color 0.16s ease;\" style-hover=\"color:var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ closeFeedback }}\">✕<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ feedbackForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top:22px;\">\n            <div style=\"margin-bottom:22px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">WHAT IS THIS ABOUT?<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ feedbackKinds }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-bottom:22px;\">\n              <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">YOUR MESSAGE — {{ feedbackCharsLeft }} CHARACTERS LEFT<\u002Flabel>\n              <textarea value=\"{{ feedbackNote }}\" sc-camel-on-change=\"{{ setFeedbackNote }}\" placeholder=\"{{ feedbackPlaceholder }}\" style=\"width:100%;border:1px solid var(--rule-4, rgba(28,28,26,0.3));background:transparent;padding:12px;font-size:15px;font-family:inherit;line-height:1.5;outline:none;min-height:120px;resize:vertical;\"><\u002Ftextarea>\n            <\u002Fdiv>\n\n            <div style=\"margin-bottom:22px;\">\n              <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">EMAIL — OPTIONAL, ONLY IF YOU WANT A REPLY<\u002Flabel>\n              <input value=\"{{ feedbackEmail }}\" sc-camel-on-change=\"{{ setFeedbackEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:9px 0;font-size:15px;font-family:inherit;outline:none;\">\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:14px;margin-bottom:22px;\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:7px 0;\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);\">SENT WITH THIS REPORT<\u002Fspan>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ feedbackContext }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:7px 0;\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);\">BUILD<\u002Fspan>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">staging · 2.0.0-rc4<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"{{ modalActionsStyle }}\">\n              <button style=\"{{ feedbackSubmitStyle }}\" sc-camel-on-click=\"{{ submitFeedback }}\">{{ feedbackSubmitLabel }}<\u002Fbutton>\n              <button style=\"background:transparent;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"border:1px solid var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ closeFeedback }}\">CANCEL<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:14px;\">REPORTS GO TO THE PUBLIC ISSUE TRACKER. DO NOT INCLUDE PERSONAL DETAILS.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ feedbackDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:28px 0 6px;\">\n            <div style=\"width:44px;height:44px;border:1.5px solid var(--accent, #003366);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:var(--accent, #003366);font-size:18px;margin-bottom:22px;\">✓<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.65;color:var(--text, #2a2822);margin-bottom:8px;\">Filed as <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px;\">#412<\u002Fspan> on the tracker. Corrections to a record are usually applied within a week.<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:18px;\" sc-camel-on-click=\"{{ closeFeedback }}\">CLOSE<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ musicBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ musicBlockedStyle }}\">\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:rgba(239,237,231,0.6);margin-bottom:7px;\">PERIOD MUSIC<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.55;\">The player opens in a small window of its own, so it keeps playing while you browse. Your browser blocked it — allow pop-ups for this site and press play again.<\u002Fdiv>\n      <\u002Fdiv>\n      <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ dismissMusicBlocked }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:rgba(239,237,231,0.6);cursor:pointer;flex-shrink:0;transition:color 0.16s ease;\" style-hover=\"color:var(--inv-fg, #F4F2ED);\">✕<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ cookieOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"{{ cookieToastStyle }}\">\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">COOKIES<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.6;color:var(--text, #2a2822);\">Essential cookies keep your session, image size and period-music setting. Analytics cookies are optional and stay off until you accept.<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:10px;\" sc-camel-on-click=\"{{ goToStatic }}\">READ THE PRIVACY POLICY →<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ cookieActionsStyle }}\">\n        <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:none;padding:13px 20px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ acceptCookies }}\">ACCEPT ALL<\u002Fbutton>\n        <button style=\"background:transparent;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:13px 20px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"border:1px solid var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ essentialCookies }}\">ESSENTIAL ONLY<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ kbdPaletteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ kbdScrimStyle }}\" sc-camel-on-click=\"{{ closePalette }}\">\n      <div style=\"{{ kbdPaletteStyle }}\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);flex-shrink:0;\">GO&nbsp;TO<\u002Fspan>\n          <input sc-camel-auto-focus=\"{{ true }}\" value=\"{{ kbdQuery }}\" sc-camel-on-change=\"{{ setKbdQuery }}\" placeholder=\"Section, artist, work — or a catalogue number\" style=\"flex:1;min-width:0;border:none;background:transparent;padding:17px 0;font-size:16px;font-family:inherit;outline:none;\">\n        <\u002Fdiv>\n        <div style=\"max-height:44vh;overflow-y:auto;\">\n          <sc-for list=\"{{ kbdResults }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"{{ r.style }}\" sc-camel-on-click=\"{{ r.onClick }}\" sc-camel-on-mouse-enter=\"{{ r.onMouseEnter }}\">\n              <span style=\"{{ r.kindStyle }}\">{{ r.kind }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:15px;line-height:1.4;\">{{ r.label }}<\u002Fspan>\n              <span style=\"{{ r.keyStyle }}\">{{ r.keyLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ kbdNoResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:26px 18px;font-size:15px;line-height:1.6;color:var(--muted, #6B6660);\">Nothing in the index matches that.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"{{ kbdPaletteFootStyle }}\">{{ kbdPaletteHint }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ kbdHelpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ kbdScrimStyle }}\" sc-camel-on-click=\"{{ closeHelp }}\">\n      <div style=\"{{ kbdHelpStyle }}\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">KEYBOARD<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:600;letter-spacing:-0.2px;\">Moving without the mouse<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px;color:var(--muted, #6B6660);cursor:pointer;padding:2px 4px;transition:color 0.16s ease;\" style-hover=\"color:var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ closeHelp }}\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ kbdHelpGridStyle }}\">\n          <sc-for list=\"{{ kbdHelpGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">{{ g.title }}<\u002Fdiv>\n              <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"{{ kbdHelpRowStyle }}\">\n                  <span style=\"{{ kbdKeyStyle }}\">{{ r.keys }}<\u002Fspan>\n                  <span style=\"font-size:14px;line-height:1.45;color:var(--text, #2a2822);\">{{ r.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--faint, #8a857c);margin-top:26px;padding-top:14px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">PRESS&nbsp;?&nbsp;OR&nbsp;ESC&nbsp;TO&nbsp;CLOSE&nbsp;·&nbsp;KEYS&nbsp;ARE&nbsp;IGNORED&nbsp;WHILE&nbsp;YOU&nbsp;ARE&nbsp;TYPING&nbsp;IN&nbsp;A&nbsp;FIELD<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ kbdBarOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ kbdBarStyle }}\">\n      <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--ink, #1C1C1A);flex-shrink:0;\">{{ kbdBarSection }}<\u002Fspan>\n      <span style=\"width:1px;height:12px;background:var(--rule-3, rgba(28,28,26,0.25));flex-shrink:0;\"><\u002Fspan>\n      <sc-for list=\"{{ kbdBarKeys }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <span style=\"display:flex;align-items:center;gap:6px;flex-shrink:0;\">\n          <span style=\"{{ kbdBarKeyStyle }}\">{{ k.keys }}<\u002Fspan>\n          <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);\">{{ k.label }}<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fsc-for>\n      <span style=\"flex:1;\"><\u002Fspan>\n      <span style=\"{{ kbdNumStyle }}\">{{ kbdNumLabel }}<\u002Fspan>\n      <span tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;flex-shrink:0;\" sc-camel-on-click=\"{{ openHelp }}\">? ALL KEYS<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNameFilter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Search options&quot;},&quot;showPeriodFilter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Search options&quot;},&quot;showDateRange&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Search options&quot;},&quot;gridColumns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:2,&quot;max&quot;:5,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;var(--accent, #003366)&quot;,&quot;options&quot;:[&quot;var(--accent, #003366)&quot;,&quot;var(--ink, #1C1C1A)&quot;,&quot;#6B3A2E&quot;,&quot;#2E5B4A&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;timelineLifelines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Timeline&quot;},&quot;timelineEventLines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Timeline&quot;},&quot;keyboardHintsAlways&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Keyboard&quot;},&quot;keyboardCue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Keyboard&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home',\n    caret: -1,\n    kbdOn: false,\n    kbdPalette: false,\n    kbdQuery: '',\n    kbdPick: 0,\n    kbdHelp: false,\n    kbdNum: '',\n    frame: 'auto',\n    theme: 'light',\n    viewMode: 'grid',\n    sortBy: 'name',\n    letter: 'ALL',\n    school: 'All',\n    gtKind: 'All',\n    gtSlug: 'italpain',\n    gtPage: 0,\n    gtRailOpen: false,\n    query: '',\n    nameFilter: '',\n    periodFilter: 'All',\n    bornFrom: 1400,\n    bornTo: 1700,\n    imageSize: 'M',\n    music: false,\n    musicTrack: '',\n    musicBlocked: false,\n    pcMusic: false,\n    dualWin: {\n      L: { view: 'artist', artist: 'vermeer', work: null, size: 'M', stack: [{ view: 'index', artist: null, work: null }] },\n      R: { view: 'work', artist: 'vermeer', work: 'The Milkmaid', size: 'M', stack: [{ view: 'index', artist: null, work: null }, { view: 'artist', artist: 'vermeer', work: null }] },\n    },\n    dualTarget: { L: 'R', R: 'R' },\n    // Each window filters the index on its own, so the two can be set against\n    // each other. The view mode is one shared preference: list until overridden.\n    dualIdx: {\n      L: { letter: 'ALL', school: 'All', nameFilter: '', periodFilter: 'All', bornFrom: 1400, bornTo: 1700, sortBy: 'name' },\n      R: { letter: 'ALL', school: 'All', nameFilter: '', periodFilter: 'All', bornFrom: 1400, bornTo: 1700, sortBy: 'name' },\n    },\n    dualIdxView: null,\n    guestName: '',\n    guestPlace: '',\n    guestNote: '',\n    gbQuery: '',\n    gbYear: 'ALL',\n    gbSort: 'new',\n    gbShown: 5,\n    awQuery: '',\n    awSchool: 'All',\n    awForm: 'All',\n    awType: 'All',\n    awTone: 'All',\n    awToneAll: false,\n    awYear: 1400,\n    awYearMax: 1700,\n    awView: 'grid',\n    cookieOpen: true,\n    glossaryQuery: '',\n    glossaryLetter: 'ALL',\n    tip: null,\n    tipAlign: 'left',\n    menuOpen: false,\n    feedbackOpen: false,\n    feedbackKind: 'Correction',\n    feedbackNote: '',\n    feedbackEmail: '',\n    feedbackSent: false,\n    copied: null,\n    statsHover: null,\n    senderName: '',\n    senderEmail: '',\n    recipientEmail: '',\n    message: '',\n    sent: false,\n    itinTitle: '',\n    itinCreator: '',\n    itinIntro: '',\n    itinListed: true,\n    itinSelected: 0,\n    itinPickerOpen: false,\n    itinPickerQuery: '',\n    itinCopied: false,\n    viewStop: 0,\n    viewer: null,\n    tlFrom: 1470,\n    tlTo: 1520,\n    tlSel: null,\n    tlPlaying: null,\n    tlLanes: { movements: true, artists: true, works: true, buildings: true, events: true, music: true },\n    relBasis: 'artist',\n    // Seeded so the builder demonstrates both a narrated and an empty stop.\n    itinStops: [\n      { key: 'The Milkmaid', title: 'The Milkmaid', artist: 'Vermeer', date: 'c. 1658', school: 'Dutch',\n        narration: 'Begin with the window. It is the only light in the room and Vermeer gives it almost a third of the wall, so that everything else — the bread, the copper, the woman herself — is described by how much of it reaches them.' },\n      { key: 'Woman Reading a Letter', title: 'Woman Reading a Letter', artist: 'Vermeer', date: 'c. 1663', school: 'Dutch',\n        narration: 'The same window, moved closer. Here the light does the narrating: we are told nothing about the letter except what the reader\\'s face does in front of it.' },\n      { key: 'The Music Lesson', title: 'The Music Lesson', artist: 'Vermeer', date: 'c. 1662', school: 'Dutch', narration: '' },\n    ],\n  };\n\n  allArtists = [\n    { id: 'bernini', name: 'Gian Lorenzo Bernini', dates: '1598–1680', school: 'Italian', period: 'Baroque', form: 'Sculpture', sort: 1598 },\n    { id: 'bruegel', name: 'Pieter Bruegel the Elder', dates: 'c. 1525–1569', school: 'Flemish', period: 'Renaissance', form: 'Painting', sort: 1525 },\n    { id: 'caravaggio', name: 'Caravaggio', dates: '1571–1610', school: 'Italian', period: 'Baroque', form: 'Painting', sort: 1571 },\n    { id: 'durer', name: 'Albrecht Dürer', dates: '1471–1528', school: 'German', period: 'Renaissance', form: 'Painting', sort: 1471 },\n    { id: 'elgreco', name: 'El Greco', dates: '1541–1614', school: 'Spanish', period: 'Mannerism', form: 'Painting', sort: 1541 },\n    { id: 'hals', name: 'Frans Hals', dates: '1582–1666', school: 'Dutch', period: 'Baroque', form: 'Painting', sort: 1582 },\n    { id: 'hooch', name: 'Pieter de Hooch', dates: '1629–1684', school: 'Dutch', period: 'Baroque', form: 'Painting', sort: 1629 },\n    { id: 'rembrandt', name: 'Rembrandt van Rijn', dates: '1606–1669', school: 'Dutch', period: 'Baroque', form: 'Painting', sort: 1606 },\n    { id: 'rubens', name: 'Peter Paul Rubens', dates: '1577–1640', school: 'Flemish', period: 'Baroque', form: 'Painting', sort: 1577 },\n    { id: 'steen', name: 'Jan Steen', dates: '1626–1679', school: 'Dutch', period: 'Baroque', form: 'Painting', sort: 1626 },\n    { id: 'titian', name: 'Titian', dates: 'c. 1490–1576', school: 'Italian', period: 'Renaissance', form: 'Painting', sort: 1490 },\n    { id: 'velazquez', name: 'Diego Velázquez', dates: '1599–1660', school: 'Spanish', period: 'Baroque', form: 'Painting', sort: 1599 },\n    { id: 'vermeer', name: 'Johannes Vermeer', dates: '1632–1675', school: 'Dutch', period: 'Baroque', form: 'Painting', sort: 1632 },\n    { id: 'vandyck', name: 'Anthony van Dyck', dates: '1599–1641', school: 'Flemish', period: 'Baroque', form: 'Painting', sort: 1599 },\n  ];\n\n  works = [\n    { id: 'pearl', title: 'Girl with a Pearl Earring', date: 'c. 1665', location: 'Mauritshuis' },\n    { id: 'delft', title: 'View of Delft', date: 'c. 1660–61', location: 'Mauritshuis' },\n    { id: 'milkmaid', title: 'The Milkmaid', date: 'c. 1658–61', location: 'Rijksmuseum' },\n    { id: 'lesson', title: 'The Music Lesson', date: 'c. 1662–65', location: 'Royal Collection' },\n    { id: 'letter', title: 'Woman Reading a Letter', date: 'c. 1663', location: 'Rijksmuseum' },\n    { id: 'geographer', title: 'The Geographer', date: 'c. 1669', location: 'Städel, Frankfurt' },\n    { id: 'lacemaker', title: 'The Lacemaker', date: 'c. 1670', location: 'Louvre' },\n    { id: 'allegory', title: 'Allegory of Painting', date: 'c. 1666–68', location: 'Kunsthistorisches' },\n  ];\n\n  schools = ['Italian', 'French', 'Dutch', 'Flemish', 'German', 'English', 'Spanish', 'Other'];\n\n  artForms = [\n    { name: 'Painting', n: 37521 },\n    { name: 'Sculpture', n: 5813 },\n    { name: 'Architecture', n: 4228 },\n    { name: 'Illumination', n: 2642 },\n    { name: 'Graphics', n: 1585 },\n    { name: 'Ceramics', n: 1058 },\n  ];\n\n  // [periodStart, Italian, French, Dutch, Flemish, German, English, Spanish, Other]\n  artworkRows = [\n    [1300, 1180, 90, 40, 210, 120, 20, 60, 140],\n    [1350, 1640, 150, 80, 340, 260, 40, 90, 180],\n    [1400, 3120, 340, 210, 760, 620, 70, 180, 260],\n    [1450, 4380, 520, 430, 980, 910, 120, 320, 340],\n    [1500, 5210, 780, 690, 1240, 1080, 210, 540, 420],\n    [1550, 4260, 1040, 1580, 1460, 720, 340, 880, 480],\n    [1600, 3180, 1620, 2940, 1180, 560, 520, 940, 520],\n    [1650, 1740, 1280, 980, 540, 380, 610, 420, 380],\n    [1700, 1240, 1180, 420, 260, 320, 780, 240, 300],\n  ];\n\n  artistRows = [\n    [1300, 92, 12, 6, 18, 14, 3, 7, 16],\n    [1350, 128, 21, 11, 31, 26, 6, 11, 22],\n    [1400, 214, 42, 28, 62, 54, 11, 21, 34],\n    [1450, 286, 61, 54, 84, 76, 18, 38, 46],\n    [1500, 324, 92, 86, 108, 94, 31, 62, 58],\n    [1550, 268, 118, 168, 126, 68, 46, 88, 64],\n    [1600, 196, 164, 264, 96, 52, 62, 84, 72],\n    [1650, 112, 132, 104, 48, 36, 71, 42, 54],\n    [1700, 84, 121, 46, 24, 30, 88, 26, 41],\n  ];\n\n  schoolTone(i) {\n    return ['var(--accent, #003366)', '#1C4D80', '#356A99', '#5786AF', '#7BA1C4', '#9FBBD6', '#C0D2E4', 'var(--faint, #8a857c)'][i];\n  }\n\n  formTone(i) {\n    return ['var(--accent, #003366)', '#2A5580', '#54789A', '#7E9AB5', '#A8BCCF', 'var(--faint, #8a857c)'][i];\n  }\n\n  donutStops() {\n    const total = this.artForms.reduce((a, r) => a + r.n, 0);\n    let at = 0;\n    return this.artForms.map((r, i) => {\n      const from = at / total * 360;\n      at += r.n;\n      return this.formTone(i) + ' ' + from.toFixed(2) + 'deg ' + (at / total * 360).toFixed(2) + 'deg';\n    }).join(', ');\n  }\n\n  periodColumns(rows, prefix) {\n    const totals = rows.map((r) => r.slice(1).reduce((a, b) => a + b, 0));\n    const max = Math.max(...totals);\n    return rows.map((r, i) => {\n      const key = prefix + '-' + i;\n      const on = this.state.statsHover === key;\n      const total = totals[i];\n      return {\n        label: String(r[0]),\n        total: total.toLocaleString('en-US'),\n        enter: () => this.setState({ statsHover: key }),\n        leave: () => this.setState({ statsHover: null }),\n        readoutStyle: {\n          fontFamily: \"ui-monospace,'SF Mono',Menlo,monospace\", fontSize: '10px', letterSpacing: '0.5px',\n          color: on ? (this.props.accentColor ?? 'var(--accent, #003366)') : 'transparent', textAlign: 'center',\n          marginBottom: '8px', whiteSpace: 'nowrap', transition: 'color 0.16s ease', flexShrink: 0,\n        },\n        labelStyle: {\n          fontFamily: \"ui-monospace,'SF Mono',Menlo,monospace\", fontSize: '10px', letterSpacing: '0.5px',\n          color: on ? 'var(--ink, #1C1C1A)' : 'var(--muted, #6B6660)', marginTop: '10px', textAlign: 'center',\n          whiteSpace: 'nowrap', transition: 'color 0.16s ease', flexShrink: 0,\n        },\n        segments: r.slice(1).map((n, j) => ({\n          style: {\n            height: (n / max * 100).toFixed(3) + '%',\n            flexShrink: 0,\n            background: this.schoolTone(j),\n            opacity: on ? 1 : 0.82,\n            transition: 'opacity 0.16s ease',\n          },\n        })),\n      };\n    });\n  }\n\n  tableRows(rows) {\n    return rows.map((r, i) => ({\n      label: r[0] + '–' + (r[0] + 49),\n      total: r.slice(1).reduce((a, b) => a + b, 0).toLocaleString('en-US'),\n      style: {\n        display: 'grid', gridTemplateColumns: '104px repeat(9, minmax(44px, 1fr))', gap: '8px',\n        minWidth: this.metrics(this.state).sm ? '560px' : 'auto', alignItems: 'baseline',\n        padding: '9px 0', borderBottom: '1px solid var(--rule, rgba(28,28,26,0.14))',\n      },\n      cells: r.slice(1).map((n) => ({\n        value: n.toLocaleString('en-US'),\n        style: { fontFamily: \"ui-monospace,'SF Mono',Menlo,monospace\", fontSize: '12px', color: 'var(--text-2, #4a463f)', textAlign: 'right' },\n      })),\n    }));\n  }\n\n  aboutSections = [\n    { index: '01', short: 'Purpose', title: 'PURPOSE', body: 'The Web Gallery of Art is a searchable database of European fine arts, decorative arts and architecture, begun in 1992 as a private collection of reproductions and published on the web from 1996. It is run without advertising and without institutional funding.', body2: 'It is intended as a study resource: every record carries the measurements, medium, date and holding institution needed to cite it, alongside commentary written for a general reader rather than a specialist.' },\n    { index: '02', short: 'Scope', title: 'WHAT IS INCLUDED', body: 'Works produced in Europe between the 3rd century and the early 20th, by artists born before 1850. Painting dominates, with substantial holdings of sculpture, architecture, illumination, ceramics, glass, metalwork and furniture.', body2: 'Living artists, non-European traditions and photography fall outside the scope. Where a work exists in several versions, the archive records each separately rather than choosing between them.' },\n    { index: '03', short: 'Organisation', title: 'HOW IT IS ORGANISED', body: 'Records are indexed by artist, school, period, form and subject type. Attribution follows the holding institution; where scholarship is divided, the entry says so rather than silently picking a side.', body2: 'Dates given as \"c.\" are approximate to within roughly a decade. Titles follow common English usage, with the original-language title kept in the record where it differs.' },\n    { index: '04', short: 'Images', title: 'IMAGES AND QUALITY', body: 'Reproductions come from institutional releases, published catalogues and photographs contributed by visitors. Each plate is offered at three sizes; the largest is intended for close reading of surface and stroke.', body2: 'Colour fidelity varies with the source and is not guaranteed. Where a better reproduction becomes available, the old file is replaced and the record keeps its address.' },\n    { index: '05', short: 'Corrections', title: 'CORRECTIONS', body: 'Errors of attribution, date, measurement or location are the ones worth reporting, and are usually fixed within a week. Please include the record address and, where possible, a published source.', body2: 'Suggestions for works to add are welcome, but the archive grows slowly and by theme rather than by request queue.' },\n    { index: '06', short: 'Music', title: 'PERIOD MUSIC', body: 'Records and tours can be read with a period music track playing. The selections are contemporary with the works rather than illustrative of them, and are drawn from freely licensed recordings.', body2: 'Music is off by default and the setting is remembered between visits.' },\n  ];\n\n  glossary = [\n    { term: 'Chiaroscuro', letter: 'C', category: 'TECHNIQUE', definition: 'Strong contrast of light and dark used to model form and direct attention. Distinct from tenebrism, where the dark ground dominates the whole picture.', uses: '1,240 WORKS' },\n    { term: 'Contrapposto', letter: 'C', category: 'FIGURE', definition: 'A standing pose with the weight on one leg, shoulders and hips turned in opposition, giving the figure a sense of latent movement.', uses: '860 WORKS' },\n    { term: 'Diptych', letter: 'D', category: 'FORMAT', definition: 'A work in two hinged panels, usually devotional and portable, read as a single composition when open.', uses: '312 WORKS' },\n    { term: 'Grisaille', letter: 'G', category: 'TECHNIQUE', definition: 'Painting executed entirely in shades of grey, often to imitate sculpture or to prepare an underlayer.', uses: '204 WORKS' },\n    { term: 'Impasto', letter: 'I', category: 'TECHNIQUE', definition: 'Paint laid on thickly enough that the stroke stands off the surface and catches the light physically.', uses: '740 WORKS' },\n    { term: 'Predella', letter: 'P', category: 'FORMAT', definition: 'The horizontal strip of small scenes at the base of an altarpiece, usually narrating episodes related to the main panel.', uses: '418 WORKS' },\n    { term: 'Sfumato', letter: 'S', category: 'TECHNIQUE', definition: 'Transitions of tone blended so finely that no line or edge is visible, used chiefly in modelling flesh.', uses: '520 WORKS' },\n    { term: 'Tenebrism', letter: 'T', category: 'TECHNIQUE', definition: 'A pronounced dominance of dark, with figures lit as if by a single raking source. Associated above all with Caravaggio and his followers.', uses: '390 WORKS' },\n trait with a Sunflower': 'Private collection',\n    'Self-Portrait at 26': 'Prado, Madrid',\n    \"Ca d'Oro, Venice\": \"Ca' d'Oro, Venice\",\n  };\n\n  rgb(hex) {\n    return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));\n  }\n\n  // Mean nearest-neighbour distance between two colour sets, both directions.\n  paletteDistance(a, b) {\n    const A = a.map((h) => this.rgb(h));\n    const B = b.map((h) => this.rgb(h));\n    const near = (p, set) => Math.min(...set.map((q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2])));\n    const mean = (xs) => xs.reduce((t, x) => t + x, 0) / xs.length;\n    return (mean(A.map((p) => near(p, B))) + mean(B.map((p) => near(p, A)))) / 2;\n  }\n\n  // Relation logic shared by the artwork page and both dual-mode windows, so a\n  // window relates works on exactly the same four bases the page offers.\n  relatedCore(title, artistName, basis, limit) {\n    const all = this.relationPool();\n    const self = all.filter((w) => w.title === title)[0];\n    const me = {\n      artist: artistName, venue: this.venues[title], sig: this.paletteSigs[title],\n      year: self ? self.year : null,\n    };\n    const pool = all.filter((w) => w.title !== title);\n    let list = [];\n    let heading = '';\n    let note = '';\n\n    if (basis === 'venue') {\n      const short = (me.venue || '').split(',')[0];\n      const article = /^(Mauritshuis|Louvre|Rijksmuseum|Prado|Uffizi|Hermitage|National Gallery|Royal Collection)/.test(short) ? 'THE ' : '';\n      list = pool.filter((w) => me.venue && w.venue === me.venue).map((w) => ({ ...w, meta: w.artist }));\n      heading = short ? 'ALSO AT ' + article + short.toUpperCase() : 'SAME COLLECTION';\n      note = list.length\n        ? list.length + (list.length === 1 ? ' OTHER WORK' : ' OTHER WORKS') + ' FROM THIS COLLECTION IS CATALOGUED HERE.'\n        : 'NO OTHER WORKS FROM THIS COLLECTION ARE CATALOGUED YET.';\n    } else if (basis === 'palette') {\n      // Authorship is the row's other basis, so colour ranks other hands only.\n      const cands = pool\n        .filter((w) => w.sig && me.sig && w.artist !== me.artist)\n        .map((w) => ({ ...w, d: this.paletteDistance(me.sig, w.sig) }))\n        .sort((a, b) => a.d - b.d);\n      const lo = cands.length ? cands[0].d : 0;\n      const hi = cands.length ? cands[cands.length - 1].d : 1;\n      const span = Math.max(1, hi - lo);\n      list = cands.slice(0, limit).map((w) => {\n        // Normalised against this pool's own range, so the spread stays legible.\n        const score = Math.round(100 - ((w.d - lo) / span) * 100);\n        return {\n          ...w,\n          meta: w.artist,\n          showSig: true,\n          match: (score >= 80 ? 'CLOSE' : score >= 55 ? 'RELATED' : 'DISTANT') + ' · ' + score,\n          sig: w.sig.map((hex) => ({ style: { flex: 1, background: hex } })),\n        };\n      });\n      heading = 'WORKS WITH A SIMILAR PALETTE';\n      note = 'RANKED ACROSS THE ARCHIVE BY DISTANCE FROM THE FIVE SAMPLED COLOURS. ' + artistName.toUpperCase() + ' IS EXCLUDED — SEE BY ARTIST.';\n    } else if (basis === 'period') {\n      const y = me.year;\n      const span = 40;\n      const seen = {};\n      // One work per hand, nearest in date: the tab answers \"who else was working\n      // then\", so a single well-catalogued artist cannot fill the row.\n      list = pool\n        .filter((w) => y && w.year && w.artist !== me.artist && Math.abs(w.year - y) <= span)\n        .sort((a, b) => Math.abs(a.year - y) - Math.abs(b.year - y))\n        .filter((w) => (seen[w.artist] ? false : (seen[w.artist] = true)))\n        .map((w) => ({ ...w, meta: w.artist + ' · ' + w.date }));\n      heading = y ? 'ARTISTS WORKING ' + (y - span) + '–' + (y + span) : 'ARTISTS FROM THE SAME PERIOD';\n      note = list.length\n        ? list.length + (list.length === 1 ? ' OTHER HAND IS' : ' OTHER HANDS ARE') + ' CATALOGUED WITHIN FORTY YEARS OF THIS WORK — ONE WORK EACH, NEAREST IN DATE.'\n        : 'NO OTHER ARTISTS ARE CATALOGUED WITHIN FORTY YEARS OF THIS WORK.';\n    } else {\n      list = pool.filter((w) => w.artist === me.artist).map((w) => ({ ...w, meta: w.date }));\n      heading = 'OTHER WORKS BY ' + artistName.toUpperCase();\n      note = list.length + ' WORKS BY THIS ARTIST ARE CATALOGUED HERE.';\n    }\n    return { heading, note, shown: list.slice(0, limit), gap: limit - Math.min(list.length, limit) };\n  }\n\n  // Sampled colours as names and shares. Where the archive holds a measured\n  // sample it is used verbatim; otherwise the band is named from its hue.\n  namedPalette(title) {\n    if (title === 'Girl with a Pearl Earring') return this.pearlPalette.slice();\n    const sig = this.paletteSigs[title] || [];\n    const shares = [38, 23, 17, 13, 9];\n    return sig.map((hex, i) => ({ name: this.colourName(hex), hex, pct: shares[i] || 5 }));\n  }\n\n  colourName(hex) {\n    const c = this.rgb(hex);\n    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;\n    const max = Math.max(r, g, b), min = Math.min(r, g, b);\n    const l = (max + min) / 2;\n    const d = max - min;\n    const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));\n    let h = 0;\n    if (d !== 0) {\n      if (max === r) h = 60 * (((g - b) / d) % 6);\n      else if (max === g) h = 60 * ((b - r) / d + 2);\n      else h = 60 * ((r - g) / d + 4);\n    }\n    if (h < 0) h += 360;\n    if (l < 0.14) return 'Ground black';\n    if (l > 0.87) return 'Chalk white';\n    if (sat < 0.12) return l < 0.38 ? 'Slate grey' : l < 0.66 ? 'Warm grey' : 'Pale grey';\n    if (h < 15 || h >= 345) return l < 0.42 ? 'Iron red' : 'Vermilion';\n    if (h < 40) return l > 0.62 ? 'Flesh tint' : sat > 0.45 ? 'Ochre' : 'Umber';\n    if (h < 68) return l > 0.66 ? 'Cream' : 'Yellow ochre';\n    if (h < 145) return l < 0.4 ? 'Olive green' : 'Sap green';\n    if (h < 200) return 'Verdigris';\n    if (h < 250) return l < 0.42 ? 'Deep blue' : 'Slate blue';\n    if (h < 295) return 'Violet';\n    return 'Madder rose';\n  }\n\n  glossaryTip(idKey, term) {\n    const entry = this.glossary.find((t) => t.term.toLowerCase() === term.toLowerCase());\n    if (!entry) return null;\n    const open = this.state.tip === idKey;\n    return {\n      open,\n      label: 'GLOSSARY · ' + entry.term.toUpperCase(),\n      body: entry.definition,\n      enter: (e) => {\n        const r = e.currentTarget.getBoundingClientRect();\n        this.setState({ tip: idKey, tipAlign: r.left + 300 > window.innerWidth - 24 ? 'right' : 'left' });\n      },\n      leave: () => this.setState({ tip: null }),\n      style: { position: 'relative', borderBottom: '1px dotted var(--accent, #003366)', color: open ? 'var(--accent, #003366)' : 'inherit', cursor: 'help' },\n    };\n  }\n\n  // Prose split into plain runs and glossary terms, so definitions stay behind\n  // a tooltip instead of interrupting the paragraph.\n  splitProse(text, keyPrefix) {\n    const plain = [{ isText: true, isTerm: false, text: text || '' }];\n    if (!text) return plain;\n    const terms = this.glossary.map((g) => g.term).filter((t) => new RegExp('\\\\b' + t + '\\\\b', 'i').test(text));\n    if (!terms.length) return plain;\n    const re = new RegExp('\\\\b(' + terms.join('|') + ')\\\\b', 'ig');\n    const parts = [];\n    let last = 0;\n    let m;\n    while ((m = re.exec(text)) !== null) {\n      if (m.index > last) parts.push({ isText: true, isTerm: false, text: text.slice(last, m.index) });\n      const t = this.glossaryTip(keyPrefix + '-' + m[1].toLowerCase(), m[1]);\n      parts.push(Object.assign({ isText: false, isTerm: true, text: m[0] }, t));\n      last = m.index + m[0].length;\n    }\n    if (last < text.length) parts.push({ isText: true, isTerm: false, text: text.slice(last) });\n    return parts;\n  }\n\n  // One source of truth for width tiers. `frame` simulates a narrower device on a\n  // wide screen; on 'auto' the real window drives the tiers, so dragging the\n  // browser edge gives the same layout a phone or tablet would get.\n
