document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);\">STACKED&nbsp;BY&nbsp;SCHOOL&nbsp;·&nbsp;BIRTH&nbsp;PERIOD<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ statsChartGridStyle }}\">\n            <sc-for list=\"{{ artistPeriods }}\" as=\"col\" hint-placeholder-count=\"9\">\n              <div style=\"{{ statsColWrapStyle }}\" sc-camel-on-mouse-enter=\"{{ col.enter }}\" sc-camel-on-mouse-leave=\"{{ col.leave }}\">\n                <div style=\"{{ col.readoutStyle }}\">{{ col.total }}<\u002Fdiv>\n                <div style=\"{{ statsColTrackStyle }}\">\n                  <sc-for list=\"{{ col.segments }}\" as=\"seg\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ seg.style }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"{{ col.labelStyle }}\">{{ col.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"{{ statsLegendStyle }}\">\n            <sc-for list=\"{{ schoolLegend }}\" as=\"item\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;align-items:center;gap:7px;\">\n                <div style=\"{{ item.swatchStyle }}\"><\u002Fdiv>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:0.5px;color:var(--text-2, #4a463f);\">{{ item.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"{{ statsCrossTabWrapStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">ARTISTS BY SCHOOL AND BIRTH PERIOD — DATA<\u002Fdiv>\n            <div style=\"{{ statsCrossTabScrollStyle }}\">\n              <div style=\"{{ crossTabHeadStyle }}\">\n                <div>BIRTH PERIOD<\u002Fdiv>\n                <sc-for list=\"{{ school iv>\n        <h1 style=\"{{ pageTitleStyle }}\">About<\u002Fh1>\n        <p style=\"max-width:560px;font-size:17px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 48px;\">What this archive contains, how it is organised, and the terms under which it may be used.<\u002Fp>\n\n        <div style=\"{{ aboutStatRowStyle }}\">\n          <sc-for list=\"{{ aboutStats }}\" as=\"stat\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"{{ aboutStatValueStyle }}\">{{ stat.value }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-top:6px;\">{{ stat.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ aboutLayoutStyle }}\">\n          <div style=\"{{ aboutNavStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:14px;\">CONTENTS<\u002Fdiv>\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <sc-for list=\"{{ aboutSections }}\" as=\"section\" hint-placeholder-count=\"6\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:{{ section.color }};\">{{ section.index }} · {{ section.short }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"max-width:620px;\">\n            <sc-for list=\"{{ aboutSections }}\" as=\"section\" hint-placeholder-count=\"6\">\n              <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;margin-bottom:40px;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">{{ section.index }} · {{ section.title }}<\u002Fdiv>\n                <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0 0 14px;\">{{ section.body }}<\u002Fp>\n                <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">{{ section.body2 }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"border-top:1px solid var(--ink, #1C1C1A);padding-top:24px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:16px;\">TERMS OF USE — SUMMARY<\u002Fdiv>\n              <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <sc-for list=\"{{ aboutTerms }}\" as=\"row\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ row.style }}\">\n                    <span style=\"font-size:15px;color:var(--text, #2a2822);\">{{ row.use }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:{{ row.color }};white-space:nowrap;\">{{ row.verdict }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:14px;\">THE COLLECTION IS PROTECTED AS A DATABASE. INDIVIDUAL REPRODUCTIONS MAY CARRY THE RIGHTS OF THE HOLDING INSTITUTION.<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:18px;\" sc-camel-on-click=\"{{ goToStatic }}\">FULL PRIVACY POLICY →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= GLOSSARY ==============    <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);text-align:right;white-space:nowrap;\">{{ term.category }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.65;color:var(--text, #2a2822);margin-bottom:12px;\">{{ term.definition }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ goToArtworks }}\">{{ term.uses }} IN THE COLLECTION →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ glossaryEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:48px 0;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <div style=\"font-size:18px;font-weight:600;margin-bottom:8px;\">No terms match.<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ resetGlossary }}\">CLEAR SEARCH →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ARTWORK SEARCH ================= -->\n    <sc-if value=\"{{ isArtworks }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Artwork Search\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">12&nbsp;—&nbsp;ARTWORK&nbsp;SEARCH<\u002Fdiv>\n        <h1 style=\"{{ pageTitleStyle }}\">Artworks<\u002Fh1>\n        <p style=\"max-width:540px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 44px;\">Filter by title, school, form, type and tone — or narrow by period when you are working through a century rather than a name.<\u002Fp>\n\n        <div style=\"{{ awSearchLayoutStyle }}\">\n          <aside style=\"{{ awFilterPanelStyle }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">FILTERS<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;\" sc-camel-on-click=\"{{ resetAwFilters }}\">RESET<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">TITLE OR ARTIST<\u002Flabel>\n              <input value=\"{{ awQuery }}\" sc-camel-on-change=\"{{ setAwQuery }}\" placeholder=\"e.g. milkmaid\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:8px 0;font-size:14px;font-family:inherit;outline:none;\">\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">SCHOOL<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ awSchools }}\" as=\"opt\" hint-placeholder-count=\"6\">\n                  <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">FORM<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ awForms }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">TYPE<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ awTypes }}\" as=\"opt\" hint-placeholder-count=\"5\">\n                  <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:6px;\">TONE<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.6;color:var(--faint, #8a857c);margin-bottom:12px;\">EDITORIAL KEYWORDS — NOT A CATALOGUE FIELD<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ awTones }}\" as=\"opt\" hint-placeholder-count=\"6\">\n                  <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;margin-top:10px;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ toggleAwToneAll }}\">{{ awToneMoreLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 0;\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">YEAR RANGE<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;\">{{ awYear }}–{{ awYearMax }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:relative;height:20px;\">\n                <div style=\"position:absolute;top:9px;left:0;right:0;height:1px;background:var(--rule-4, rgba(28,28,26,0.3));\"><\u002Fdiv>\n                <div style=\"{{ awRangeFillStyle }}\"><\u002Fdiv>\n                <input class=\"range-thumb\" type=\"range\" min=\"1400\" max=\"1700\" step=\"10\" value=\"{{ awYear }}\" sc-camel-on-change=\"{{ setAwYear }}\" style=\"position:absolute;top:0;left:0;width:100%;height:20px;margin:0;\">\n                <input class=\"range-thumb\" type=\"range\" min=\"1400\" max=\"1700\" step=\"10\" value=\"{{ awYearMax }}\" sc-camel-on-change=\"{{ setAwYearMax }}\" style=\"position:absolute;top:0;left:0;width:100%;height:20px;margin:0;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--faint, #8a857c);margin-top:8px;\">\n                <span>1400<\u002Fspan>\n                <span>1700<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Faside>\n\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--muted, #6B6660);\">{{ awCountLabel }}<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;align-items:center;\">\n                <div style=\"{{ awGridBtnStyle }}\" sc-camel-on-click=\"{{ setAwGrid }}\">GRID<\u002Fdiv>\n                <div style=\"{{ awListBtnStyle }}\" sc-camel-on-click=\"{{ setAwList }}\">LIST<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ awIsGrid }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"{{ awGridStyle }}\">\n                <sc-for list=\"{{ awResults }}\" as=\"work\" hint-placeholder-count=\"9\">\n                  <div data-kbd-idx=\"{{ work.kbdIdx }}\" tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ work.cardStyle }}\" style-hover=\"opacity:0.68;\" sc-camel-on-click=\"{{ goToArtwork }}\">\n                    <span style=\"{{ work.caretStyle }}\">▸<\u002Fspan>\n                    <div style=\"aspect-ratio:4/5;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:10px;margin-bottom:10px;position:relative;overflow:hidden;\">\n                      <div style=\"{{ work.imgStyle }}\"><\u002Fdiv>\n                      <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:0.5px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ work.title }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:14px;font-weight:600;line-height:1.3;\">{{ work.title }}<\u002Fdiv>\n                    <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-top:3px;line-height:1.6;\">{{ work.artist }}, {{ work.date }}<br>{{ work.school }} · {{ work.type }}<\u002Fdiv>\n                    <div style=\"{{ work.addStyle }}\" sc-camel-on-click=\"{{ work.add }}\">{{ work.addLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ awIsList }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:4px;\">\n                <sc-for list=\"{{ awResults }}\" as=\"work\" hint-placeholder-count=\"9\">\n                  <div data-kbd-idx=\"{{ work.kbdIdx }}\" tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ work.rowStyle }}\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ goToArtwork }}\">\n                    <span style=\"{{ work.caretStyle }}\">▸<\u002Fspan>\n                    <div style=\"width:44px;height:54px;flex-shrink:0;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));overflow:hidden;\"><div style=\"{{ work.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0;\">\n                      <div style=\"font-size:15px;font-weight:600;line-height:1.3;\">{{ work.title }}<\u002Fdiv>\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-top:3px;\">{{ work.artist }}, {{ work.date }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"{{ awListMetaStyle }}\">\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ work.school }}<\u002Fdiv>\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ work.form }}<\u002Fdiv>\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ work.type }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"{{ work.addStyle }}\" sc-camel-on-click=\"{{ work.add }}\">{{ work.addLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ awEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:56px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <div style=\"font-size:18px;font-weight:600;margin-bottom:8px;\">No works match these filters.<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);margin-bottom:16px;max-width:380px;\">Widen the year range or clear the school filter — the collection is uneven across periods.<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ resetAwFilters }}\">RESET FILTERS →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--muted, #6B6660);\">PAGE 1 OF {{ awPages }}<\u002Fdiv>\n              <div style=\"display:flex;gap:14px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1px;\">\n                <div style=\"color:var(--faint-2, #9c968c);\">← PREV<\u002Fdiv>\n                <div style=\"color:var(--accent, #003366);cursor:pointer;\">NEXT →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= GUESTBOOK ================= -->\n    <sc-if value=\"{{ isGuestbook }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Guestbook\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">10&nbsp;—&nbsp;GUESTBOOK<\u002Fdiv>\n        <h1 style=\"{{ pageTitleStyle }}\">Guestbook<\u002Fh1>\n        <p style=\"max-width:540px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 44px;\">Notes from people who have spent time with the collection. {{ entryCount }} entries, oldest kept since 1998.<\u002Fp>\n\n        <div style=\"{{ guestbookLayoutStyle }}\">\n          <div style=\"{{ guestbookFormStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:20px;\">LEAVE A NOTE<\u002Fdiv>\n            <div style=\"margin-bottom:20px;\">\n              <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">NAME<\u002Flabel>\n              <input value=\"{{ guestName }}\" sc-camel-on-change=\"{{ setGuestName }}\" placeholder=\"Jane Doe\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:10px 0;font-size:15px;font-family:inherit;outline:none;\">\n            <\u002Fdiv>\n            <div style=\"margin-bottom:20px;\">\n              <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">LOCATION<\u002Flabel>\n              <input value=\"{{ guestPlace }}\" sc-camel-on-change=\"{{ setGuestPlace }}\" placeholder=\"Delft, NL\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:10px 0;font-size:15px;font-family:inherit;outline:none;\">\n            <\u002Fdiv>\n            <div style=\"margin-bottom:24px;\">\n              <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">NOTE — {{ guestCharsLeft }} CHARACTERS LEFT<\u002Flabel>\n              <textarea value=\"{{ guestNote }}\" sc-camel-on-change=\"{{ setGuestNote }}\" placeholder=\"What did you come here to find?\" style=\"width:100%;border:1px solid var(--rule-4, rgba(28,28,26,0.3));background:transparent;padding:12px;font-size:15px;font-family:inherit;line-height:1.5;outline:none;min-height:120px;resize:vertical;\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:none;padding:15px 24px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1.5px;cursor:pointer;width:100%;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ submitGuestEntry }}\">SIGN THE GUESTBOOK →<\u002Fbutton>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:14px;\">ENTRIES ARE MODERATED BEFORE PUBLICATION. EMAIL ADDRESSES ARE NOT SHOWN.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"margin-bottom:22px;\">\n              <div style=\"display:flex;gap:14px;align-items:center;padding-bottom:18px;\">\n                <input value=\"{{ gbQuery }}\" sc-camel-on-change=\"{{ setGbQuery }}\" placeholder=\"Search entries by name, place or text\" style=\"flex:1;min-width:0;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:9px 0;font-size:14px;font-family:inherit;outline:none;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);white-space:nowrap;\">{{ gbScopeTotal }}&nbsp;FOUND<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">JUMP TO YEAR<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:2px;\">\n                <sc-for list=\"{{ gbYears }}\" as=\"opt\" hint-placeholder-count=\"8\">\n                  <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;padding-bottom:10px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n              <div>{{ gbHeading }}<\u002Fdiv>\n              <div style=\"color:var(--accent, #003366);cursor:pointer;letter-spacing:1px;\" sc-camel-on-click=\"{{ toggleGbSort }}\">{{ gbSortLabel }} ↕<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ entries }}\" as=\"entry\" hint-placeholder-count=\"5\">\n              <div data-kbd-idx=\"{{ entry.kbdIdx }}\" style=\"{{ entry.rowStyle }}\">\n                <span style=\"{{ entry.caretStyle }}\">▸<\u002Fspan>\n                <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-bottom:8px;\">\n                  <div style=\"font-size:15px;font-weight:600;\">{{ entry.name }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);text-align:right;\">{{ entry.place }} · {{ entry.date }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:16px;line-height:1.65;color:var(--text, #2a2822);\">{{ entry.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ gbEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:44px 0;\">\n                <div style=\"font-size:17px;font-weight:600;margin-bottom:8px;\">No entries match.<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ resetGb }}\">CLEAR SEARCH AND YEAR →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">SHOWING {{ gbCount }} OF {{ gbScopeTotal }}<\u002Fdiv>\n              <div style=\"{{ gbMoreStyle }}\" sc-camel-on-click=\"{{ loadMoreGb }}\">{{ gbMoreLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= CONTRIBUTORS ================= -->\n    <sc-if value=\"{{ isContributors }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Contributors\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">11&nbsp;—&nbsp;CONTRIBUTORS<\u002Fdiv>\n        <h1 style=\"{{ pageTitleStyle }}\">Contributors<\u002Fh1>\n        <p style=\"max-width:560px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 44px;\">The archive was created by Emil Krén and Daniel Marx and has been maintained in the open since. Version&nbsp;2 was made possible by the people below.<\u002Fp>\n\n        <div style=\"{{ founderRowStyle }}\">\n          <sc-for list=\"{{ founders }}\" as=\"person\" hint-placeholder-count=\"2\">\n            <div style=\"flex:1;min-width:0;border-top:1px solid var(--ink, #1C1C1A);padding-top:18px;\">\n              <div style=\"display:flex;gap:16px;align-items:flex-start;\">\n                <div style=\"width:64px;height:64px;flex-shrink:0;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));\"><\u002Fdiv>\n                <div>\n                  <div style=\"font-size:20px;font-weight:600;margin-bottom:4px;\">{{ person.name }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);margin-bottom:10px;\">{{ person.role }}<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);\">{{ person.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin:56px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">CODE&nbsp;CONTRIBUTORS<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">{{ contribCount }} PEOPLE · SINCE 2023<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ contribGridStyle }}\">\n          <sc-for list=\"{{ contributors }}\" as=\"person\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"width:36px;height:36px;flex-shrink:0;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));\"><\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;\">{{ person.handle }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:0.5px;color:var(--muted, #6B6660);margin-top:3px;\">{{ person.area }} · {{ person.commits }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:56px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">SPONSORS<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">HOSTING AND IMAGE PROCESSING · {{ sponsorYear }}<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"max-width:560px;font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);margin:24px 0 32px;\">Running costs are covered entirely by recurring sponsorship. Tiers are listed for transparency; no sponsor has any say in what the archive contains.<\u002Fp>\n\n        <div style=\"{{ sponsorTierGridStyle }}\">\n          <sc-for list=\"{{ sponsorTiers }}\" as=\"tier\" hint-placeholder-count=\"3\">\n            <div style=\"{{ tier.style }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:{{ tier.labelColor }};\">{{ tier.label }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">{{ tier.amount }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;color:var(--text, #2a2822);margin-bottom:16px;\">{{ tier.covers }}<\u002Fdiv>\n              <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:12px;\">\n                <sc-for list=\"{{ tier.names }}\" as=\"row\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;justify-content:space-between;gap:12px;padding:7px 0;\">\n                    <span style=\"font-size:14px;color:var(--text, #2a2822);\">{{ row.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:0.5px;color:var(--faint, #8a857c);white-space:nowrap;\">{{ row.since }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:56px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">SERVICES&nbsp;DONATED<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">IN&nbsp;KIND&nbsp;·&nbsp;NOT&nbsp;PAID&nbsp;FOR<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"max-width:560px;font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);margin:24px 0 32px;\">Tools the project runs on for free because their makers keep an open-source programme. They are listed here as thanks, not as endorsements; none of them see visitor data beyond what the pages below describe.<\u002Fp>\n\n        <div style=\"{{ partnerGridStyle }}\">\n          <sc-for list=\"{{ sponsorPartners }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"{{ p.style }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;\">\n                <div style=\"font-size:19px;font-weight:600;letter-spacing:-0.2px;\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">{{ p.kind }}<\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:15px;line-height:1.6;color:var(--text, #2a2822);margin:0 0 14px;\">{{ p.note }}<\u002Fp>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ p.terms }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:0.5px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\">{{ p.link }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ sponsorLedgerStyle }}\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:14px;\">WHERE THE MONEY GOES — {{ sponsorYear }}<\u002Fdiv>\n          <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <sc-for list=\"{{ sponsorLedger }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <div style=\"{{ ledgerRowStyle }}\">\n                <span style=\"font-size:14px;line-height:1.35;color:var(--text, #2a2822);\">{{ row.item }}<\u002Fspan>\n                <div style=\"height:3px;background:var(--rule-soft, rgba(28,28,26,0.12));\">\n                  <div style=\"{{ row.barStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);text-align:right;\">{{ row.share }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:12px;\">NO SALARIES ARE PAID. ANY SURPLUS CARRIES FORWARD TO THE NEXT YEAR.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ supportRowStyle }}\">\n          <div style=\"flex:1;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">SUPPORT THE PROJECT<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:600;margin-bottom:8px;\">Open source, no advertising.<\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 16px;max-width:440px;\">Donations cover hosting and image processing. Contributions of code, corrections and commentary are equally welcome.<\u002Fp>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n              <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:none;padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\">SPONSOR ON GITHUB →<\u002Fbutton>\n              <button style=\"background:transparent;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:14px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"border:1px solid var(--ink, #1C1C1A);\">KO-FI<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:{{ repoCardWidth }};flex-shrink:0;border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:18px;\">\n            <div style=\"display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">REPOSITORY<\u002Fspan>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;\">blackfyre/wga<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">LICENCE<\u002Fspan>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;\">Apache 2.0<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">STACK<\u002Fspan>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;\">Go · HTMX · Tailwind<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">OPEN ISSUES<\u002Fspan>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;\">38<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= DUAL MODE ================= -->\n    <sc-if value=\"{{ isDual }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Dual Mode\" style=\"{{ dualShellStyle }}\">\n\n        <sc-if value=\"{{ dualNarrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px;\">\n            <div style=\"max-width:430px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:12px;\">09&nbsp;—&nbsp;DUAL&nbsp;MODE<\u002Fdiv>\n              <div style=\"font-size:27px;font-weight:600;line-height:1.2;margin-bottom:12px;\">This mode needs a wide screen<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.65;color:var(--text-2, #4a463f);margin:0 0 22px;\">Dual mode gives each half of the display a complete record page — image, cataloguing, commentary, citation. Below about 1080 pixels there is no honest way to show two of those at once, so the mode is not offered on phones or tablets in either orientation.<\u002Fp>\n              <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ dualExit }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\">← LEAVE DUAL MODE<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ dualWide }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;flex:1;min-height:0;\">\n\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;padding:11px 22px;border-bottom:1px solid var(--ink, #1C1C1A);flex-shrink:0;\">\n              <div style=\"display:flex;align-items:center;gap:12px;\">\n                <div style=\"width:26px;height:26px;border:1.5px solid var(--ink, #1C1C1A);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;font-weight:700;letter-spacing:0.5px;\">WGA<\u002Fdiv>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;\">09&nbsp;—&nbsp;DUAL&nbsp;MODE<\u002Fspan>\n                <span tabindex=\"0\" style=\"{{ dualHelp.style }}\" sc-camel-on-mouse-enter=\"{{ dualHelp.enter }}\" sc-camel-on-mouse-leave=\"{{ dualHelp.leave }}\" sc-camel-on-focus=\"{{ dualHelp.enter }}\" sc-camel-on-blur=\"{{ dualHelp.leave }}\">?<sc-if value=\"{{ dualHelp.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tooltipDownStyle }}\"><span style=\"{{ tooltipLabelStyle }}\">{{ dualHelp.label }}<\u002Fspan>{{ dualHelp.body }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:18px;\">\n                <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ dualSwap }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\">⇄ SWAP WINDOWS<\u002Fdiv>\n                <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ dualReset }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);cursor:pointer;transition:color 0.16s ease;\" style-hover=\"color:var(--accent, #003366);\">RESET BOTH<\u002Fdiv>\n                <span tabindex=\"0\" style=\"{{ dualSwapHelp.style }}\" sc-camel-on-mouse-enter=\"{{ dualSwapHelp.enter }}\" sc-camel-on-mouse-leave=\"{{ dualSwapHelp.leave }}\" sc-camel-on-focus=\"{{ dualSwapHelp.enter }}\" sc-camel-on-blur=\"{{ dualSwapHelp.leave }}\">?<sc-if value=\"{{ dualSwapHelp.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tooltipDownStyle }}\"><span style=\"{{ tooltipLabelStyle }}\">{{ dualSwapHelp.label }}<\u002Fspan>{{ dualSwapHelp.body }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ dualExit }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:5px 11px;cursor:pointer;transition:border-color 0.16s ease;\" style-hover=\"border-color:var(--ink, #1C1C1A);\">EXIT ✕<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"{{ dualLayoutStyle }}\">\n              <sc-for list=\"{{ dualSides }}\" as=\"side\" hint-placeholder-count=\"2\">\n                <div style=\"{{ side.paneStyle }}\">\n\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 28px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));flex-shrink:0;\">\n                    <div style=\"display:flex;align-items:center;gap:10px;min-width:0;\">\n                      <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--inv-fg, #F4F2ED);background:var(--accent-bg, #003366);padding:3px 7px;\">{{ side.tag }}<\u002Fspan>\n                      <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;white-space:nowrap;overflow:hidden;display:flex;align-items:baseline;gap:6px;min-width:0;\">\n                        <sc-for list=\"{{ side.crumbTrail }}\" as=\"crumb\" hint-placeholder-count=\"2\">\n                          <span style=\"{{ crumb.wrapStyle }}\">\n                            <sc-if value=\"{{ crumb.sep }}\" hint-placeholder-val=\"{{ false }}\">\n                              <span style=\"color:var(--faint, #8a857c);\">/<\u002Fspan>\n                            <\u002Fsc-if>\n                            <span tabindex=\"{{ crumb.tab }}\" role=\"{{ crumb.role }}\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ crumb.onClick }}\" style=\"{{ crumb.style }}\" style-hover=\"opacity:0.6;\" title=\"{{ crumb.label }}\">{{ crumb.label }}<\u002Fspan>\n                          <\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:14px;flex-shrink:0;\">\n                      <sc-if value=\"{{ side.canBack }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ side.onBack }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\">← BACK<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ side.onHome }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);cursor:pointer;transition:color 0.16s ease;\" style-hover=\"color:var(--accent, #003366);\">INDEX<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex;align-items:center;gap:9px;padding:8px 28px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14 e.relCards }}\" as=\"card\" hint-placeholder-count=\"3\">\n                              <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ card.onClick }}\" style=\"cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.68;\">\n                                <div style=\"aspect-ratio:4/5;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:9px;margin-bottom:9px;position:relative;overflow:hidden;\">\n                                  <div style=\"{{ card.imgStyle }}\"><\u002Fdiv>\n                                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:0.5px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ card.title }}<\u002Fspan>\n                                <\u002Fdiv>\n                                <div style=\"font-size:13px;font-weight:600;line-height:1.3;\">{{ card.title }}<\u002Fdiv>\n                                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-top:3px;\">{{ card.meta }}<\u002Fdiv>\n                                <sc-if value=\"{{ card.showSig }}\" hint-placeholder-val=\"{{ false }}\">\n                                  <div style=\"display:flex;align-items:center;gap:8px;margin-top:8px;\">\n                                    <div style=\"display:flex;height:10px;flex:1;\">\n                                      <sc-for list=\"{{ card.sig }}\" as=\"c\" hint-placeholder-count=\"5\">\n                                        <div style=\"{{ c.style }}\"><\u002Fdiv>\n                                      <\u002Fsc-for>\n                                    <\u002Fdiv>\n                                    <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:0.5px;color:var(--accent, #003366);\">{{ card.match }}<\u002Fspan>\n                                  <\u002Fdiv>\n                                <\u002Fsc-if>\n                              <\u002Fdiv>\n                            <\u002Fsc-for>\n                            <sc-if value=\"{{ side.relFill }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"{{ side.relFillStyle }}\">\n                                <div style=\"font-size:13px;line-height:1.45;\">{{ side.relFillText }}<\u002Fdiv>\n                                <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;margin-top:12px;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ side.relFillAction }}\">{{ side.relFillCta }}<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                          <div tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" sc-camel-on-click=\"{{ side.onUp }}\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);cursor:pointer;margin-top:16px;transition:color 0.16s ease;\" style-hover=\"color:var(--accent, #003366);\">{{ side.upLabel }}<\u002Fdiv>\n                        <\u002Fdiv>\n\n                        <div style=\"margin-top:38px;padding-top:16px;border-top:1px solid var(--ink, #1C1C1A);\">\n                          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                            <div style=\"display:flex;align-items:center;gap:8px;\">\n                              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">CITE&nbsp;THIS&nbs
