n    { handle: 'k-toth', area: 'Search', commits: '96 commits' },\n    { handle: 'm-varga', area: 'Data import', commits: '74 commits' },\n    { handle: 'renovate[bot]', area: 'Dependencies', commits: '311 commits' },\n    { handle: 'a-nagy', area: 'Accessibility', commits: '52 commits' },\n    { handle: 'l-berg', area: 'Dual mode', commits: '29 commits' },\n    { handle: 's-oyelaran', area: 'Infrastructure', commits: '21 commits' },\n    { handle: 'p-dubois', area: 'Postcards', commits: '17 commits' },\n  ];\n\n  // ---------- Guided Tours ----------\n  // Editorial, curator-owned, and structurally unlike an itinerary: a tour is a\n  // piece of writing with the collection attached to it — chapters, artist lists,\n  // sub-tours and a bibliography — revised in place and never deleted. Twenty-six\n  // are published; three are rebuilt into the chapter view below.\n  guidedTourData = [\n    {\n      no: '1', slug: 'italpain', kind: 'Survey', title: 'Overview of Italian Painters, 1200–1850',\n      blurb: 'The artist index refiltered by local school and set against a timeline, with a note on what each school decided.',\n      editor: 'Emil Krén', published: '1998', revised: '2024', scope: '1,910 works', cover: 'Venus of Urbino',\n      pages: [\n        {\n          type: 'text', section: 'Florence', title: 'Florence', dateline: 'c. 1280 – 1600',\n          paras: [\n            'The Florentine school is usually introduced through its famous names, which hides what actually holds it together: in Florence the figure is built before it is coloured. Giotto gives a body weight, Masaccio gives it a floor to stand on, and by the middle of the fifteenth century the drawing underneath a painting is the argument the painting is making.',\n            'What follows is not a shortlist. The next page rearranges the artist index by year of birth, which puts a run of workshop masters between the names most visitors arrive looking for — and that is the point. The famous solutions were arrived at in company.',\n          ],\n        },\n        {\n          type: 'list', section: 'Florence', title: 'The Florentine painters, in order of birth', dateline: 'Index page',\n          intro: 'The whole index, filtered to Florence and sorted by birth year rather than by reputation. Each name opens its own record.',\n          rows: [\n            ['Giotto di Bondone', '1267–1337', 'Padua, Assisi, Florence. The weight of a body, settled once.'],\n            ['Fra Angelico', 'c. 1395–1455', 'San Marco. A painter working under vows, and none the plainer for it.'],\n            ['Masaccio', '1401–1428', 'The Brancacci Chapel, and dead at twenty-seven.'],\n            ['Filippo Lippi', 'c. 1406–1469', 'The Carmelite who left the order and took the manner with him.'],\n            ['Sandro Botticelli', '1445–1510', 'Medici commissions, then Savonarola, then near-silence.'],\n            ['Domenico Ghirlandaio', '1449–1494', 'The largest shop in the city; Michelangelo trained in it.'],\n            ['Leonardo da Vinci', '1452–1519', 'Trained under Verrocchio, left for Milan, finished almost nothing.'],\n            ['Michelangelo Buonarroti', '1475–1564', 'A sculptor who painted when he was told to.'],\n          ],\n        },\n        {\n          type: 'picture', section: 'Florence', work: 'Primavera', title: 'Primavera',\n          credit: 'Sandro Botticelli · c. 1480 · Tempera on panel, 202 × 314 cm · Galleria degli Uffizi, Florence',\n          paras: [\n            'Nothing in this picture stands on ground you could measure. The orange grove is a backdrop rather than a place, the figures are spaced like a frieze, and the whole composition is resolved on the surface — which is why it survives reproduction better than almost any painting of its decade.',\n            'It was painted for a room in a Medici house and its subject has been argued over ever since. This tour does not settle that. What matters here is the drawing: every contour is closed, and the colour is laid inside lines that were fixed before the brush arrived.',\n          ],\n        },\n        {\n          type: 'picture', section: 'Florence', work: 'Mona Lisa', title: 'Mona Lisa',\n          credit: 'Leonardo da Vinci · 1503–19 · Oil on poplar, 77 × 53 cm · Musée du Louvre, Paris',\n          paras: [\n            'Leonardo does the opposite and dissolves the contour. Transitions are built in glazes thin enough that no edge is ever final, and the corners of the mouth and the eyes — the two places a face is read from — are left deliberately unresolved.',\n            'The landscape behind is not a place either, but it is a system: things recede by losing contrast and turning blue, which is a rule about air rather than a rule about drawing. Florence had not painted that before.',\n          ],\n        },\n        {\n          type: 'text', section: 'Siena', title: 'Siena', dateline: 'c. 1280 – 1450',\n          paras: [\n            'Siena took a different decision and kept it for a century and a half. Gold stays behind the figures, contour carries the feeling, and volume is conceded only where it is needed. Read straight after Florence this looks like conservatism; read on its own terms it is a separate and complete solution.',\n            'A sub-tour branches from here and follows the Maestà — the Virgin enthroned as the city\\'s own protection — which Siena commissioned again and again and treated less as a devotional image than as a civic portrait.',\n          ],\n        },\n        {\n          type: 'list', section: 'Siena', title: 'The Sienese painters', dateline: 'Index page',\n          intro: 'A short school, and an unusually consistent one. Six names carry almost the whole of it.',\n          rows: [\n            ['Duccio di Buoninsegna', 'c. 1255–1319', 'The Maestà for the cathedral high altar, carried there in procession.'],\n            ['Simone Martini', 'c. 1284–1344', 'Siena, Assisi, then the papal court at Avignon.'],\n            ['Pietro Lorenzetti', 'c. 1280–1348', 'The elder brother; both are presumed lost to the plague.'],\n            ['Ambrogio Lorenzetti', 'c. 1290–1348', 'The Allegory of Good and Bad Government, painted for the men it judged.'],\n            ['Sassetta', 'c. 1392–1450', 'Gothic manner held deliberately, a century after Florence let it go.'],\n            ['Giovanni di Paolo', 'c. 1403–1482', 'The last of them, and the strangest.'],\n          ],\n        },\n        {\n          type: 'text', section: 'Venice', title: 'Venice', dateline: 'c. 1450 – 1780',\n          paras: [\n            'Venice is the school where colour is laid down first and the drawing is found inside it. Damp made fresco impractical, so Venetian painters moved to oil on canvas earlier and at greater scale than anywhere else in Italy, and the technique changed what the pictures were able to be about.',\n            'This section runs past the Renaissance deliberately. Tiepolo and the view painters are the last stage of the same argument, and stopping at 1600 makes the school look far shorter than it was.',\n          ],\n        },\n        {\n          type: 'list', section: 'Venice', title: 'The Venetian painters', dateline: 'Index page',\n          intro: 'Three hundred years, held together by a technique rather than by a city plan.',\n          rows: [\n            ['Giovanni Bellini', 'c. 1430–1516', 'The workshop everyone else came out of.'],\n            ['Giorgione', 'c. 1477–1510', 'Six paintings, at most, and an entire manner.'],\n            ['Titian', 'c. 1488–1576', 'Sixty years at the top of European painting.'],\n            ['Tintoretto', '1518–1594', 'Scale, speed, and the Scuola di San Rocco.'],\n            ['Paolo Veronese', '1528–1588', 'Tried by the Inquisition for putting dogs in a Last Supper.'],\n            ['Giambattista Tiepolo', '1696–1770', 'The last painter of ceilings anyone believed.'],\n            ['Canaletto', '1697–1768', 'The city sold back to the people visiting it.'],\n          ],\n        },\n        {\n          type: 'picture', section: 'Venice', work: 'Venus of Urbino', title: 'Venus of Urbino',\n          credit: 'Titian · 1538 · Oil on canvas, 119 × 165 cm · Galleria degli Uffizi, Florence',\n          paras: [\n            'The picture is built from two horizontals and one long diagonal, and the diagonal is the body. Everything else — the curtain, the floor, the chest at the back — is there to keep that line from being interrupted.',\n            'Painted for the Duke of Urbino as a marriage picture, it borrows Giorgione\\'s sleeping Venus and wakes her up. The frankness is in the eye contact and in the flat, even light, well before it is anywhere in the pose.',\n          ],\n        },\n        {\n          type: 'picture', section: 'Venice', work: \"Ca d'Oro, Venice\", title: \"Ca d'Oro\",\n          credit: 'Giovanni and Bartolomeo Bon · c. 1428–30 · Istrian stone and marble · Grand Canal, Venice',\n          paras: [\n            'A merchant\\'s house that spends its whole budget on one elevation. The façade is asymmetrical because the plan behind it is: the loggias mark the great hall, and the solid block to the right is the private range.',\n            'The tracery is Gothic and the layout is Veneto-Byzantine — the combination the city kept using for two hundred years after the rest of Italy had moved on. It was gilded when new, which is where the name comes from.',\n          ],\n        },\n        {\n          type: 'text', section: 'Rome and the south', title: 'Rome and the south', dateline: 'c. 1500 – 1700',\n          paras: [\n            'Rome is less a school than a destination. Painters arrived on papal commission, worked alongside each other in the same handful of buildings and left again, so the style of the city turns over every twenty years while the patronage stays exactly where it is.',\n            'Two arrivals reset it. Raphael\\'s Vatican rooms make the ideal figure a public standard, and eighty years later Caravaggio replaces it with a model off the street, lit from one side, in a room the congregation could recognise as their own.',\n          ],\n        },\n        {\n          type: 'list', section: 'Rome and the south', title: 'Painters working in Rome and Naples', dateline: 'Index page',\n          intro: 'Almost none of them were born here. The index is filtered by where the work is, not by where the painter came from.',\n          rows: [\n            ['Raphael', '1483–1520', 'Urbino, Florence, then eight years that fixed the standard.'],\n            ['Annibale Carracci', '1560–1609', 'Bolognese; the Farnese ceiling and a school of followers.'],\n            ['Caravaggio', '1571–1610', 'Lombard, and the reason the next fifty years look the way they do.'],\n            ['Guido Reni', '1575–1642', 'The correction to Caravaggio, and hugely more copied at the time.'],\n            ['Salvator Rosa', '1615–1673', 'Neapolitan. Landscape with the weather turned up.'],\n            ['Luca Giordano', '1634–1705', 'Fast enough to earn the nickname, and good enough to keep it.'],\n          ],\n        },\n        {\n          type: 'picture', section: 'Rome and the south', work: 'The School of Athens', title: 'The School of Athens',\n          credit: 'Raphael · 1509–11 · Fresco, base 770 cm · Stanza della Segnatura, Vatican',\n          paras: [\n            'Raphael sets fifty-odd figures in a barrel-vaulted hall and never lets the architecture win. The vanishing point falls between the two men walking forward at the centre, so the whole building is doing nothing except pointing at them.',\n            'The room was Julius II\\'s library, and the wall opposite carries theology. Philosophy here is not being argued against it — the two are given identical ceilings and identical dignity, which was the commission\\'s entire point.',\n          ],\n        },\n        {\n          type: 'picture', section: 'Rome and the south', work: 'The Calling of St Matthew', title: 'The Calling of St Matthew',\n          credit: 'Caravaggio · 1600 · Oil on canvas, 322 × 340 cm · Contarelli Chapel, San Luigi dei Francesi, Rome',\n          paras: [\n            'The light enters high on the right, along the line of Christ\\'s hand, and stops at the table. It is not coming from the window painted just below it, and Caravaggio does not pretend otherwise: the beam is the event, not the weather.',\n            'The men at the table are dressed in 1600, not in the first century. That decision — sacred history happening in the clothes and the room of the people looking at it — is the one the next generation of European painters could not leave alone.',\n          ],\n        },\n      ],\n      sources: [\n        \"CHASTEL, André, Les Arts de l'Italie, Presses Universitaires de France, Paris, 1963\",\n        'The Encyclopedia of Visual Art, Encyclopaedia Britannica International, London, 1983',\n        'HUYGHE, René, Larousse Encyclopedia of Renaissance and Baroque Art, Hamlyn, London, 1964',\n        'GALLWITZ, Karl Ludwig, The Handbook of Italian Renaissance Painters, Prestel, Munich, 1999',\n      ],\n    },\n    {\n      no: '2', slug: 'sculptor', kind: 'Survey', title: 'Overview of Sculptors, 1100–1900',\n      blurb: 'Sculptors in approximate chronological order, with short explanations of the stylistic periods they fall between.',\n      editor: 'Emil Krén', published: '1998', revised: '2019', scope: '640 works',\n    },\n    {\n      no: '3', slug: 'giotto', kind: 'Artist', title: 'The Art of Giotto',\n      blurb: 'Assisi, the Arena Chapel and Santa Croce in full, with the panel paintings commented alongside.',\n      editor: 'Emil Krén', published: '1999', revised: '2021', scope: '196 works',\n    },\n    {\n      no: '4', slug: 'arezzo', kind: 'Site', title: \"Legend of the True Cross: Piero della Francesca in Arezzo\",\n      blurb: 'The complete San Francesco cycle, explained scene by scene after the 1985–2000 restoration.',\n      editor: 'Daniel Marx', published: '1999', revised: '2020', scope: '58 works',\n    },\n    {\n      no: '5', slug: 'sistina', kind: 'Site', title: 'Visit to the Sistine Chapel',\n      blurb: 'The ceiling, the Last Judgment and the fifteenth-century side walls, taken in the order you would walk them.',\n      editor: 'Emil Krén', published: '1998', revised: '2023', scope: '212 images', cover: 'The Creation of Adam',\n      pages: [\n        {\n          type: 'text', section: 'Before Michelangelo', title: 'The room already had an argument', dateline: '1481 – 1482',\n          paras: [\n            'The chapel had been decorated once already. In eighteen months a team working under Perugino painted the two long walls with parallel cycles — the life of Moses on one side, the life of Christ on the other — arranged so that each episode answers the one facing it across the room.',\n            'Almost every visitor now walks in under the ceiling and never looks at eye level again. This tour starts at the walls on purpose: Michelangelo was painting into a room that already had a case to make.',\n          ],\n        },\n        {\n          type: 'list', section: 'Before Michelangelo', title: 'The team of 1481', dateline: 'Index page',\n          intro: 'Six painters, one contract, eighteen months. Sixtus IV hired the best shops in central Italy and set them to work at the same time.',\n          rows: [\n            ['Pietro Perugino', 'c. 1446–1523', 'Directed the whole campaign. Christ Giving the Keys to St Peter.'],\n            ['Sandro Botticelli', '1445–1510', 'Three walls, and the Punishment of Korah among them.'],\n            ['Domenico Ghirlandaio', '1449–1494', 'The Calling of the First Apostles.'],\n            ['Cosimo Rosselli', '1439–1507', 'Criticised at the time for using too much gold. Paid the most.'],\n            ['Luca Signorelli', 'c. 1450–1523', 'The Testament and Death of Moses, in part.'],\n            ['Pinturicchio', 'c. 1454–1513', 'In Perugino\\'s shop, not yet under his own name.'],\n          ],\n        },\n        {\n          type: 'text', section: 'The ceiling', title: 'The vault, 1508–1512', dateline: '1508 – 1512',\n          paras: [\n            'Michelangelo was a sculptor with one fresco of consequence behind him when Julius II handed him the vault. What he produced is not a picture on a ceiling but a painted architecture pretending to hold one up, with the nine Genesis scenes let into it like openings.',\n            'The scenes run against the direction of the visit. The Creation is above the altar and the Drunkenness of Noah above the door, so entering from the back means walking backwards through the story towards its beginning.',\n          ],\n        },\n        {\n          type: 'picture', section: 'The ceiling', work: 'The Creation of Adam', title: 'The Creation of Adam',\n          credit: 'Michelangelo · 1511–12 · Fresco · Sistine Chapel ceiling, Vatican',\n          paras: [\n            'The gap between the two hands is about the width of a wrist, and it is the only empty space in the composition that matters. Everything either side is packed — the cloak full of figures, the reclining body braced against the ground — so that the interval reads as the subject.',\n            'Adam is already fully formed and already beautiful; what he is receiving is not a body but animation. Michelangelo makes that legible by giving him a slack arm and God a rigid one.',\n          ],\n        },\n        {\n          type: 'text', section: 'The altar wall', title: 'The Last Judgment', dateline: '1535 – 1541',\n          paras: [\n            'Twenty-three years later Michelangelo came back to paint the altar wall, and blocked out two windows and three of the fifteenth-century frescoes in order to do it. The result carries no architecture at all: four hundred figures on an open blue ground, rising on the left and falling on the right.',\n            'The nudity was being argued about within a decade of the unveiling, and draperies were added after the Council of Trent. This section marks which of them are sixteenth-century additions and which have since been taken off again.',\n          ],\n        },\n        {\n          type: 'text', section: 'Restoration', title: 'What the cleaning found', dateline: '1980 – 1994',\n          paras: [\n            'Fourteen years of restoration lifted off four centuries of candle soot, animal glue and earlier repainting. The colour underneath was far higher in key than anyone had been working from — acid greens, orange shot through with lilac — and it changed how the sixteenth century is described in every survey written since.',\n            'The argument is not closed. A minority position holds that the cleaning also removed a final modelling layer applied by Michelangelo himself. The pages that follow reproduce a cleaned and an uncleaned detail so the case can be looked at rather than read about.',\n          ],\n        },\n      ],\n      sources: [\n        \"CAMESASCA, Ettore, L'Opera completa di Michelangelo pittore, Rizzoli, Milano, 1966\",\n        'VECCHI, Pierluigi de and COLALUCCI, Gianluigi, Michelangelo — The Vatican Frescoes, Abbeville Press, New York, 1996',\n        'BARTZ, Gabriele and KÖNIG, Eberhard, Michelangelo, Könemann, Cologne, 1998',\n        'HEUSINGER, Lutz, Michelangelo, Scala/Riverside, New York, 1989',\n      ],\n    },\n    {\n      no: '6', slug: 'brancacc', kind: 'Site', title: 'Visit to the Brancacci Chapel, Florence',\n      blurb: 'Masolino, Masaccio and Filippino Lippi wall by wall, with the details carried on separate pages.',\n      editor: 'Emil Krén', published: '1999', revised: '2018', scope: '74 images',\n    },\n    {\n      no: '6a', slug: 'gozzoli', kind: 'Artist', title: 'Narrative fresco cycles by Benozzo Gozzoli',\n      blurb: 'Three cycles — Montefalco, Florence, San Gimignano — with the subjects unpacked and the biography given in full.',\n      editor: 'Daniel Marx', published: '2004', revised: '2020', scope: '128 images',\n    },\n    {\n      no: '7', slug: 'lowcount', kind: 'Survey', title: 'Painting in the Low Countries, 1400–1800',\n      blurb: 'Four centuries of Flemish and Dutch painting, each preceded by a summary of the history behind it.',\n      editor: 'Emil Krén', published: '2000', revised: '2022', scope: '2,340 works',\n    },\n    {\n      no: '8', slug: 'siena', kind: 'Site', title: 'Art in Siena, 13th–16th centuries',\n      blurb: 'Duccio, Simone Martini and the Lorenzetti, with sub-tours and a section on the Maestà.',\n      editor: 'Emil Krén', published: '2001', revised: '2019', scope: '410 works',\n    },\n    {\n      no: '9', slug: 'spain', kind: 'Survey', title: 'Art in Spain, 13th–17th centuries',\n      blurb: 'El Greco and Velázquez in detail, set against articles on every Spanish king of the period.',\n      editor: 'Daniel Marx', published: '2001', revised: '2021', scope: '780 works',\n    },\n    {\n      no: '10', slug: 'gothic', kind: 'Survey', title: 'Painting of the International Gothic',\n      blurb: 'One homogenous European style known by a dozen names; the tour settles on what it actually looks like.',\n      editor: 'Emil Krén', published: '2002', revised: '', scope: '295 works',\n    },\n    {\n      no: '11', slug: 'flemish', kind: 'Theme', title: 'Early Flemish Altarpieces',\n      blurb: 'Winged altarpieces from Broederlam to Memling: whole, wings apart, and in detail where the detail survives.',\n      editor: 'Emil Krén', published: '2002', revised: '2017', scope: '146 works',\n    },\n    {\n      no: '11a', slug: 'venetian', kind: 'Theme', title: 'Venetian Altarpieces',\n      blurb: 'Over fifty large altarpieces, reproduced above the collection standard because the originals are monumental.',\n      editor: 'Daniel Marx', published: '2008', revised: '2023', scope: '54 works',\n    },\n    {\n      no: '11b', slug: 'chapels', kind: 'Site', title: 'Italian Renaissance chapels with sculpted decoration',\n      blurb: 'Six buildings whose sculpture was commissioned to a single design and has survived that way.',\n      editor: 'Daniel Marx', published: '2021', revised: '', scope: '112 images',\n    },\n    {\n      no: '11c', slug: 'lombard', kind: 'Survey', title: 'Lombard painting in the 16th century',\n      blurb: \"From Leonardo's naturalism to Caravaggio's realism, through Milan, Brescia, Bergamo and Cremona.\",\n      editor: 'Daniel Marx', published: '2022', revised: '', scope: '188 works',\n    },\n    {\n      no: '12', slug: 'french', kind: 'Survey', title: 'French art, 15th–18th centuries',\n      blurb: 'Fouquet to Houdon: Gothic, Renaissance, Mannerist, Baroque and Rococo taken as one sequence.',\n      editor: 'Emil Krén', published: '2003', revised: '2018', scope: '960 works',\n    },\n    {\n      no: '13', slug: 'english', kind: 'Survey', title: 'British art, 15th–18th centuries',\n      blurb: 'A long dominance by foreign-born artists, and then Hogarth, Reynolds and Gainsborough.',\n      editor: 'Emil Krén', published: '2003', revised: '', scope: '340 works',\n    },\n    {\n      no: '14', slug: 'german', kind: 'Survey', title: 'Art in the Germanic countries, 1450–1550',\n      blurb: 'The golden age of German painting, with the woodcuts and engravings given equal weight.',\n      editor: 'Emil Krén', published: '2004', revised: '2019', scope: '720 works',\n    },\n    {\n      no: '14a', slug: 'secessio', kind: 'Survey', title: 'Art Nouveau: artists, craftsmen and their works',\n      blurb: 'The style that set out to unify fine and applied art, country by country, with a full list of names.',\n      editor: 'Daniel Marx', published: '2019', revised: '2024', scope: '640 works',\n    },\n    {\n      no: '14b', slug: 'still', kind: 'Theme', title: 'Still-Life Paintings in the collection',\n      blurb: 'A history of the genre and its subgenres, then all 1,400 still-lifes sorted by their 360 painters.',\n      editor: 'Daniel Marx', published: '2019', revised: '2024', scope: '1,412 works',\n    },\n    {\n      no: '14c', slug: 'portrait', kind: 'Theme', title: 'The Art of Portrait Painting',\n      blurb: 'Portraits grouped by format, sitter, setting and function — and then 4,800 of them to browse.',\n      editor: 'Daniel Marx', published: '2020', revised: '2025', scope: '4,812 works',\n    },\n    {\n      no: '14d', slug: 'north', kind: 'Survey', title: 'Northern Renaissance Art',\n      blurb: 'The art of the region north of the Alps, by artist, by centre, and by the themes they shared.',\n      editor: 'Daniel Marx', published: '2022', revised: '2025', scope: '5,860 works',\n    },\n    {\n      no: '14e', slug: 'romantic', kind: 'Survey', title: 'Romanticism in Visual Arts',\n      blurb: '1770–1840 across Europe and America: landscape, heroism, the supernatural, and national feeling.',\n      editor: 'Daniel Marx', published: '2023', revised: '2025', scope: '890 works',\n    },\n    {\n      no: '14f', slug: 'music', kind: 'Theme', title: 'Music in Visual Arts',\n      blurb: 'Musicians, instruments and musical allegory — and a summary of what was actually being played.',\n      editor: 'Daniel Marx', published: '2024', revised: '2025', scope: '340 images', cover: 'The Music Lesson',\n      pages: [\n        {\n          type: 'text', section: 'Occasions', title: 'Music as an occasion', dateline: 'Fifteenth to eighteenth century',\n          paras: [\n            'Music enters European painting as something people are shown doing, usually together, and usually with the social meaning of the occasion doing more work than the sound. A lute in a tavern and a virginal in a front room are not the same instrument in the same picture.',\n            'These pages group the works by setting rather than by date: the courtly consort, the domestic keyboard, the street musician, and the concert used as a pretext for a portrait group.',\n          ],\n        },\n        {\n          type: 'picture', section: 'Occasions', work: 'The Music Lesson', title: 'Lady at the Virginal with a Gentleman',\n          credit: 'Johannes Vermeer · c. 1662–65 · Oil on canvas, 74 × 65 cm · Royal Collection, London',\n          paras: [\n            'Two-thirds of the canvas is empty room. The figures are pushed back against the far wall and the floor tiles run the whole depth to get you there, so the picture is about the distance between the viewer and the lesson at least as much as about the lesson.',\n            'The mirror above the virginal shows the girl\\'s face turned towards the man — which the figure itself does not show — and, at its lower edge, the leg of Vermeer\\'s own easel. The inscription on the lid says that music is the companion of joy and the medicine of sorrow.',\n          ],\n        },\n        {\n          type: 'text', section: 'Evidence', title: 'The instrument as evidence', dateline: 'Organology',\n          paras: [\n            'For instrument historians, paintings are primary sources. A great many sixteenth-century instruments survive only as depictions, and the good depictions are accurate enough to count strings on, read fret spacing from, and date by a bridge design.',\n            'These pages flag where a painter can be trusted and where he cannot. Decorative instruments assembled out of imagination are common, and they are marked as such here rather than left for the reader to catch.',\n          ],\n        },\n        {\n          type: 'text', section: 'Meaning', title: 'Music as argument', dateline: 'Allegory and vanitas',\n          paras: [\n            'Because it cannot be held, music was the readiest emblem available for things that pass. A broken string means discord or death; an untuned lute beside a skull says the same thing twice; harmony between two players stands in for a marriage nobody has painted directly.',\n            'The standard emblems come first, and then the cases where a painter uses one against its own meaning — which is generally where the interesting pictures are.',\n          ],\n        },\n        {\n          type: 'text', section: 'Meaning', title: 'What it sounded like', dateline: 'The period-music selection',\n          paras: [\n            'The tour ends by turning from images to sound. Every artist page in this collection carries a short piece from the artist\\'s own decades, and this page lists those pieces beside the works they were chosen against.',\n            'The point is not accompaniment. Hearing what a Haarlem congregation actually heard in the 1620s makes the paintings of that congregation less familiar, and less familiar is the useful direction.',\n          ],\n        },\n      ],\n      sources: [\n        'MEER, John Henry van der, Musikinstrumente, Prestel-Verlag, München, 1983',\n        'AUSONI, Alberto, Music in Art, J. Paul Getty Museum, Los Angeles, 2009',\n        'EMBER, Ildikó, Music in Painting, Corvina, Budapest, 1989',\n        'Early Music Instrument Database, Case Western Reserve University',\n      ],\n    },\n    {\n      no: '15', slug: 'mini', kind: 'Survey', title: 'Mini-Tours in European Painting',\n      blurb: 'Short tours on German Gothic, Bohemian painting of the 1300s, and Caravaggism after Caravaggio.',\n      editor: 'Emil Krén', published: '2005', revised: '', scope: '210 works',\n    },\n    {\n      no: '16', slug: 'women', kind: 'Theme', title: 'Women Artists in the collection',\n      blurb: 'Eighty-eight women active between the fifteenth and nineteenth centuries, each with a biography.',\n      editor: 'Daniel Marx', published: '2018', revised: '2024', scope: '88 artists',\n    },\n  ];\n\n  gtBySlug(slug) {\n    return this.guidedTourData.find((t) => t.slug === slug) || this.guidedTourData[0];\n  }\n\n  // The route: title page, the authored pages, then the bibliography as a page\n  // of its own. A tour with no authored pages is still a two-page walk, so the\n  // shell never has to special-case an empty one.\n  tourWalk(t) {\n    const mid = t.pages || [];\n    const end = (t.sources || []).length ? [{ type: 'sources', section: 'Sources', title: 'Sources' }] : [];\n    return [{ type: 'title', title: 'Title page' }].concat(mid, end);\n  }\n\n  stepTourPage(d) {\n    const walk = this.tourWalk(this.gtBySlug(this.state.gtSlug));\n    const next = Math.min(Math.max(0, (this.state.gtPage || 0) + d), walk.length - 1);\n    if (next === (this.state.gtPage || 0)) return;\n    this.setState({ gtPage: next });\n    window.scrollTo(0, 0);\n  }\n\n  tours = [\n    { id: 'light', title: 'Light in the Dutch interior', count: '14 works', period: '17th century', note: 'How daylight became a subject in its own right.' },\n    { id: 'donors', title: 'Donors and patrons', count: '22 works', period: '14th–16th century', note: 'Who paid, and how they placed themselves in the picture.' },\n    { id: 'venus', title: 'Versions of the Venus pudica', count: '11 works', period: '15th–17th century', note: 'One pose, reworked across two centuries.' },\n    { id: 'ruins', title: 'Architecture in ruins', count: '18 works', period: '17th–18th century', note: 'The ruin as measurement, memory and stage set.' },\n  ];\n\n  // Visitor-made itineraries. Distinct from the editorial tours above: a maximum of\n  // fifteen works, narrated by whoever assembled them, deleted after one year.\n  itineraryData = [\n    {\n      id: 'five-rooms', title: 'Five rooms, one window', creator: 'Marta Kowalska', date: '22 JUL 2026',\n      note: 'Dutch interiors read as one problem of light, in the order I teach them.',\n      stops: [\n        ['The Milkmaid', 'The window is the subject. It takes almost a third of the wall, and everything else in the room is described by how much of it arrives.'],\n        ['Girl with a Pearl Earring', 'Now the room is gone entirely. The same light, but with nothing for it to fall on except a face turned out of the dark.'],\n        ['The Laughing Cavalier', 'Compare the handling. Hals lets the brush stay visible where Vermeer buries it; the lace is written rather than described.'],\n        ['The Night Watch', 'Light used as staging instead of weather — it picks out who matters and lets the rest of the company fall back.'],\n        ['View of Delft', 'End outside. The same painter, the same hour of the morning, and the town given the treatment he gave a tabletop.'],\n      ],\n    },\n    {\n      id: 'toledo-delft', title: 'Toledo to Delft', creator: 'H. Lindqvist', date: '18 JUL 2026',\n      note: 'Two cities painted from outside their walls, sixty years apart.',\n      stops: [\n        ['View of Toledo', 'A city under weather that is doing the emotional work. The topography is roughly right; the sky is not from that afternoon.'],\n        ['View of Delft', 'The opposite instinct. Nothing is heightened, and the drama is that the light is exactly as ordinary as it was.'],\n        ['Hunters in the Snow', 'Between them, a landscape that is neither portrait nor allegory but an inventory of what people do in winter.'],\n        ['Ca d\\'Oro, Venice', 'Close on architecture recorded for its own sake, before landscape had been agreed to be a subject at all.'],\n      ],\n    },\n    {\n      id: 'religious-light', title: 'Where the light comes from', creator: 'Daniel Osei', date: '09 JUL 2026',\n      note: 'Six works in which the light source is an argument, not a condition.',\n      stops: [\n        ['The Calling of St Matthew', 'The shaft enters with the figure of Christ and stops at the hand it is meant to single out. It is not daylight; it is the event.'],\n        ['The Descent from the Cross', 'Rubens puts the brightest thing in the picture — the shroud — under the body, so the weight reads downward.'],\n        ['Apollo and Daphne', 'In marble the same job falls to the polish. Bernini leaves the bark matt and the flesh burnished.'],\n        ['Venus of Urbino', 'A flat, even light with nowhere to hide. The frankness is in the lighting before it is in the pose.'],\n        ['Self-Portrait at 26', 'Dürer lights himself from the front, frontally, in a pose reserved for devotional images. The claim is deliberate.'],\n        ['Self-Portrait with a Sunflower', 'A century later the same move is made lightly, with a prop and a raised eyebrow.'],\n      ],\n    },\n    {\n      id: 'students-caravaggio', title: 'A student\\'s Caravaggio', creator: 'Anon.', date: '27 JUN 2026',\n      note: 'Three works in the order they were first shown to me, with what I was told about each.',\n      stops: [\n        ['The Calling of St Matthew', 'I was told to find the hand first and then work out where the light had come from. It took longer than it should have.'],\n        ['Las Meninas', 'Then this, to show what a painter does with a dark room when he wants you to notice yourself looking.'],\n        ['The Laughing Cavalier', 'And finally a picture with no darkness in it at all, so that the first two would stop looking normal.'],\n      ],\n    },\n  ];\n\n  stopsFrom(pairs) {\n    return pairs.map(([title, narration]) => {\n      const w = this.catalogue.find((c) => c.title === title) || {};\n      return { key: title, title, artist: w.artist || '', date: w.date || '', school: w.school || '', narration };\n    });\n  }\n\n  durationOf(stops) {\n    const words = stops.reduce((a, st) => a + (st.narration.trim() ? st.narration.trim().split(/\\s+/).length : 0), 0);\n    return Math.max(1, Math.round(words / 150 + stops.length * 0.6)) + ' MIN';\n  }\n\n  formatDate(d) {\n    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();\n  }\n\n  itinSlug() {\n    const t = this.state.itinTitle.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');\n    return t ? t.slice(0, 40) : 'untitled';\n  }\n\n  addToItinerary(work) {\n    const s = this.state;\n    if (s.itinStops.length >= 15) return;\n    if (s.itinStops.some((st) => st.key === work.title)) return;\n    this.setState({\n      itinStops: s.itinStops.concat([{\n        key: work.title, title: work.title, artist: work.artist,\n        date: work.date, school: work.school, narration: '',\n      }]),\n    });\n  }\n\n  moveStop(i, d) {\n    const next = this.state.itinStops.slice();\n    const j = i + d;\n    if (j < 0 || j >= next.length) return;\n    const tmp = next[i];\n    next[i] = next[j];\n    next[j] = tmp;\n    this.setState({ itinStops: next, itinSelected: j });\n  }\n\n  removeStop(i) {\n    const next = this.state.itinStops.slice();\n    next.splice(i, 1);\n    this.setState({ itinStops: next, itinSelected: Math.max(0, Math.min(i, next.length - 1)) });\n  }\n\n  openViewer(title, creator, stops) {\n    this.setState({ page: 'itinerary-view', viewStop: 0, viewer: { title, creator, stops } });\n  }\n\n  stepViewer(d) {\n    const v = this.state.viewer;\n    if (!v || !v.stops.length) return;\n    this.setState((st) => ({ viewStop: Math.min(v.stops.length - 1, Math.max(0, st.viewStop + d)) }));\n  }\n\n  // ---------- Keyboard navigation ----------\n  // Letter, page, catalogue number, label. Letters follow the numbered sections\n  // printed at the head of each screen; J/K/H/L stay free for movement.\n  kbdScreens = [\n    ['H', 'home', '00', 'HOME'],\n    ['A', 'artists', '01', 'ARTIST INDEX'],\n    ['P', 'postcard-compose', '04', 'POSTCARD SERVICE'],\n    ['R', 'static', '06', 'GENERAL CONTENT'],\n    ['I', 'tours', '07', 'INSPIRATION'],\n    ['S', 'search', '08', 'SEARCH RESULTS'],\n    ['D', 'dual', '09', 'DUAL MODE'],\n    ['G', 'guestbook', '10', 'GUESTBOOK'],\n    ['C', 'contributors', '11', 'CONTRIBUTORS'],\n    ['W', 'artworks', '12', 'ARTWORK SEARCH'],\n    ['L', 'glossary', '13', 'GLOSSARY'],\n    ['B', 'about', '14', 'ABOUT THE COLLECTION'],\n    ['N', 'stats', '15', 'STATISTICS'],\n    ['V', 'itineraries', '16', 'VISITOR ITINERARIES'],\n    ['E', 'itinerary-build', '17', 'ITINERARY BUILDER'],\n    ['U', 'guided-tours', '20', 'GUIDED TOURS'],\n    ['T', 'timeline', '19', 'TIMELINE EXPLORER'],\n  ];\n\n  // Filtered lists live here so both renderVals and the key handler can ask for\n  // them; the caret must never depend on a value written during render.\n  artistList(s) {\n    const q = s.query.trim().toLowerCase();\n    const nameQ = s.nameFilter.trim().toLowerCase();\n    const showNameFilter = this.props.showNameFilter ?? true;\n    const showPeriodFilter = this.props.showPeriodFilter ?? true;\n    const showDateRange = this.props.showDateRange ?? true;\n    const out = this.allArtists.filter((a) => {\n      const okSchool = s.school === 'All' || a.school === s.school;\n      const okName = !showNameFilter || !nameQ || a.name.toLowerCase().includes(nameQ);\n      const okPeriod = !showPeriodFilter || s.periodFilter === 'All' || a.period === s.periodFilter;\n      const okBorn = !showDateRange || (a.sort >= s.bornFrom && a.sort <= s.bornTo);\n      if (!(okName && okPeriod && okBorn)) return false;\n      const okLetter = s.letter === 'ALL' || a.name.split(' ').slice(-1)[0][0].toUpperCase() === s.letter;\n      const okQuery = !q || a.name.toLowerCase().includes(q) || a.school.toLowerCase().includes(q) || a.period.toLowerCase().includes(q);\n      return okSchool && okLetter && okQuery;\n    });\n    return out.slice().sort((a, b) => (s.sortBy === 'name' ? a.name.localeCompare(b.name) : a.sort - b.sort));\n  }\n\n  workList(s) {\n    const aq = s.awQuery.trim().toLowerCase();\n    return this.catalogue.filter((w) => {\n      const okQuery = !aq || w.title.toLowerCase().includes(aq) || w.artist.toLowerCase().includes(aq);\n      return okQuery && (s.awSchool === 'All' || w.school === s.awSchool)\n        && (s.awForm === 'All' || w.form === s.awForm)\n        && (s.awType === 'All' || w.type === s.awType)\n        && (s.awTone === 'All' || (w.tone || []).includes(s.awTone))\n        && w.year >= s.awYear && w.year <= s.awYearMax;\n    });\n  }\n\n  guestbookScope(s \n    };\n  }\n\n\n  // ---------- Timeline explorer ----------\n  // Rows are one item deep (no packing): each lane prints a band header, then one\n  // labelled row per item, and every mark is positioned as a percentage of the\n  // open window so the plot survives any container width.\n  tlLaneMeta = [\n    ['movements', 'MOVEMENTS', 'var(--accent, #003366)'],\n    ['artists', 'ARTISTS — LIFELINES', '#1C4D80'],\n    ['works', 'DATED WORKS', '#356A99'],\n    ['buildings', 'BUILDING CAMPAIGNS', '#5786AF'],\n    ['events', 'EVENTS OUTSIDE THE STUDIO', 'var(--muted, #6B6660)'],\n    ['music', 'MUSIC — COMPOSERS AND A DATED WORK', '#7BA1C4'],\n  ];\n\n  tlMovementData = [\n    ['International Gothic', 1375, 1425, 'Courtly, gilded and pan-European: the last flowering of Gothic painting before Florentine perspective took hold.'],\n    ['Early Renaissance', 1400, 1490, 'Florence first — linear perspective, antique models, and the human figure measured rather than symbolised.'],\n    ['Northern Renaissance', 1420, 1550, 'Oil glazes and microscopic observation in the Low Countries and Germany, on panels made for private devotion.'],\n    ['Venetian Renaissance', 1470, 1580, 'Colour before line: Venice describes light and flesh instead of contour, and paints on canvas rather than panel.'],\n    ['High Renaissance', 1490, 1527, 'A short, dense window in Florence and Rome. It closes with the Sack of Rome and the dispersal of its workshops.'],\n    ['Mannerism', 1520, 1590, 'Elongated figures, difficult poses and cold colour — style itself becomes the subject of the picture.'],\n    ['Baroque', 1590, 1700, 'Diagonal, movement and spotlight. Art as persuasion in the decades after the Council of Trent.'],\n    ['Dutch Golden Age', 1600, 1680, 'A market without a court: landscape, interior, portrait and still life, sold to merchants by the yard.'],\n    ['French Classicism', 1620, 1700, 'Order, antiquity and the Académie — Poussin set against Rubens for a century of argument.'],\ n Age is already half over.'],\n  ];\n\n  // piece, composer, year\n  tlMusicData = [\n    ['Nuper rosarum flores', 'Guillaume Dufay', 1436],\n    ['Missa prolationum', 'Johannes Ockeghem', 1470],\n    ['Bel acueil', 'Antoine Busnois', 1465],\n    ['Missa Quant jay au cueur', 'Heinrich Isaac', 1495],\n    ['Missa Pange lingua', 'Josquin des Prez', 1515],\n    ['Missa Ave sanctissima Maria', 'Pierre de la Rue', 1506],\n    ['Pope Marcellus Mass', 'Giovanni Pierluigi da Palestrina', 1562],\n    [\"L'Orfeo\", 'Claudio Monteverdi', 1607],\n    ['Membra Jesu nostri', 'Dieterich Buxtehude', 1680],\n    ['Dido and Aeneas', 'Henry Purcell', 1689],\n  ];\n\n  tlPresetData = [\n    ['ALL 1300–1800', 1300, 1800],\n    ['EARLY RENAISSANCE', 1400, 1490],\n    ['HIGH RENAISSANCE', 1470, 1520],\n    ['MANNERISM', 1520, 1590],\n    ['BAROQUE', 1590, 1700],\n    ['DUTCH GOLDEN AGE', 1600, 1680],\n    ['VERMEER’S LIFETIME', 1630, 1680],\n  ];\n\n  tlDensityBuckets() {\n    if (this._tlDens) return this._tlDens;\n    const b = new Array(50).fill(0);\n    const add = (y) => {\n      const i = Math.floor((y - 1300) / 10);\n      if (i >= 0 && i < 50) b[i] += 1;\n    };\n    this.tlAllWorks().forEach((w) => add(w.year));\n    this.tlArtistData.forEach((r) => { for (let y = r[1] + 20; y <= r[2]; y += 10) add(y); });\n    this._tlDens = b;\n    return b;\n  }\n\n  tlYearLabel(a, b) { return a === b ? String(a) : a + '–' + b; }\n\n  // Dated works come from one merged, deduped list so the lane band and the\n  // works panel can never report different counts for the same window.\n  tlAllWorks() {\n    if (this._tlWorks) return this._tlWorks;\n    const rows = this.tlWorkData.map((r) => ({ title: r[0], year: r[1], artist: r[2], place: r[3], date: String(r[1]) }))\n      .concat(this.catalogue.map((w) => ({ title: w.title, year: w.year, artist: w.artist, place: '', date: w.date })));\n    this._tlWorks = rows.filter((w, i) => rows.findIndex((o) => o.title === w.title) === i).sort((x, y) => x.year - y.year);\n    return this._tlWorks;\n  }\n\n  tlItemsFor(key, from, to) {\n    const hit = (a, b) => b >= from && a <= to;\n    if (key === 'movements') {\n      return this.tlMovementData.filter((r) => hit(r[1], r[2])).map((r) => ({\n        kind: 'MOVEMENT', name: r[0], a: r[1], b: r[2], body: r[3], meta: this.tlYearLabel(r[1], r[2]),\n      }));\n    }\n    if (key === 'artists') {\n      return this.tlArtistData.filter((r) => hit(r[1], r[2])).map((r) => ({\n        kind: 'ARTIST', name: r[0], a: r[1], b: r[2], life: true, place: r[4], school: r[3],\n        meta: this.tlYearLabel(r[1], r[2]),\n        body: r[3] + ' school, working from ' + r[4] + '. The pale rule is the whole life; the solid bar is the working years the catalogue can account for.',\n        link: 'OPEN THE ARTIST RECORD →', go: 'artist',\n      }));\n    }\n    if (key === 'works') {\n      return this.tlAllWorks().filter((w) => hit(w.year, w.year)).map((w) => ({\n        kind: 'DATED WORK', name: w.title, a: w.year, b: w.year, point: true, place: w.place,\n        meta: String(w.year),\n        body: w.artist + ', dated ' + w.date + (w.place ? '. Recorded in ' + w.place + '.' : '.'),\n        link: 'OPEN THE CATALOGUE RECORD →', go: 'artwork',\n      }));\n    }\n    if (key === 'buildings') {\n      return this.tlBuildingData.filter((r) => hit(r[1], r[2])).map((r) => ({\n        kind: 'BUILDING CAMPAIGN', name: r[0], a: r[1], b: r[2], hatch: true, place: r[3],\n        meta: this.tlYearLabel(r[1], r[2]),\n        body: 'Under construction ' + r[1] + '–' + r[2] + ' in ' + r[3] + '. Campaigns overlap the careers above them; the hatching is the span, not a completion date.',\n      }));\n    }\n    if (key === 'events') {\n      return this.tlEventData.filter((r) => hit(r[1], r[2])).map((r) => ({\n        kind: 'EVENT', name: r[0], a: r[1], b: r[2], rule: true, body: r[3],\n        meta: this.tlYearLabel(r[1], r[2]),\n      }));\n    }\n    return this.tlMusicData.filter((r) => hit(r[2], r
