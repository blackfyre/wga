:var(--text-2, #4a463f);margin:0 0 44px;\">A random slice of the collection, for when you do not want to start from a fixed name or period. Reload for another set.<\u002Fp>\n        <div style=\"{{ toursGridStyle }}\">\n          <sc-for list=\"{{ tours }}\" as=\"tour\" hint-placeholder-count=\"4\">\n            <div style=\"cursor:pointer;padding-top:20px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\" sc-camel-on-click=\"{{ tour.onClick }}\">\n              <div style=\"aspect-ratio:16/9;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:12px;margin-bottom:16px;position:relative;overflow:hidden;\">\n                <div style=\"{{ tour.imgStyle }}\"><\u002Fdiv>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ tour.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:8px;\">{{ tour.count }} · {{ tour.period }}<\u002Fdiv>\n              <div style=\"font-size:20px;font-weight:600;margin-bottom:6px;\">{{ tour.title }}<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);\">{{ tour.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:56px;padding-top:22px;border-top:1px solid var(--ink, #1C1C1A);max-width:560px;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">IF YOU WANT SOMETHING ORDERED<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.7;color:var(--text, #2a2822);margin:0 0 16px;\">The sets above are shuffled, and nothing above argues a case. Two other routes do. Guided Tours are chaptered essays written by the editors and kept in revision; Itineraries are short sequences assembled and narrated by visitors.<\u002Fp>\n          <div style=\"display:flex;gap:24px;flex-wrap:wrap;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ goToGuidedTours }}\">GUIDED TOURS →<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ goToItineraries }}\">BROWSE ITINERARIES →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= SEARCH RESULTS ================= -->\n    <sc-if value=\"{{ isSearch }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Search Results\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">08&nbsp;—&nbsp;SEARCH&nbsp;RESULTS<\u002Fdiv>\n        <h1 style=\"{{ resultsTitleStyle }}\">Results for {{ searchTermLabel }}<\u002Fh1>\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--muted, #6B6660);margin-bottom:44px;\">{{ resultCount }} ARTISTS · SEARCHED NAME, TITLE, SCHOOL, PERIOD<\u002Fdiv>\n\n        <div style=\"{{ searchResultsStyle }}\">\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;padding-bottom:10px;border-bottom:1px solid var(--ink, #1C1C1A);margin-bottom:4px;\">ARTISTS<\u002Fdiv>\n            <sc-for list=\"{{ matchedArtists }}\" as=\"artist\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));cursor:pointer;\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ artist.onClick }}\">\n                <div style=\"font-size:15px;font-weight:600;\">{{ artist.name }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);text-align:right;\">{{ artist.dates }}<br>{{ artist.school }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:16px;\" sc-camel-on-click=\"{{ goToArtists }}\">ALL MATCHING ARTISTS →<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;padding-bottom:10px;border-bottom:1px solid var(--ink, #1C1C1A);margin-bottom:4px;\">WORKS<\u002Fdiv>\n            <sc-for list=\"{{ matchedWorks }}\" as=\"work\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));cursor:pointer;\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ goToArtwork }}\">\n                <div style=\"width:44px;height:54px;flex-shrink:0;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));overflow:hidden;\"><div style=\"{{ work.imgStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-size:15px;font-weight:600;line-height:1.3;\">{{ work.title }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-top:3px;\">Vermeer, {{ work.date }} · {{ work.location }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:16px;\" sc-camel-on-click=\"{{ goToArtworks }}\">ALL MATCHING WORKS →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ARTIST LISTING ================= -->\n    <sc-if value=\"{{ isArtists }}\" hint-placeholder-val=\"{{ true }}\">\n      <main data-screen-label=\"Artist Listing\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">01&nbsp;—&nbsp;ARTIST&nbsp;INDEX<\u002Fdiv>\n        <h1 style=\"{{ pageTitleStyle }}\">Artists<\u002Fh1>\n        <p style=\"max-width:540px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 36px;\">Painters, sculptors and architects in the collection. Browse alphabetically, or filter by school and period.<\u002Fp>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:2px;padding-bottom:20px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n          <sc-for list=\"{{ alphabet }}\" as=\"entry\" hint-placeholder-count=\"9\">\n            <div style=\"{{ entry.style }}\" sc-camel-on-click=\"{{ entry.onClick }}\">{{ entry.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ filterRowStyle }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-right:6px;\">SCHOOL<\u002Fdiv>\n            <sc-for list=\"{{ schools }}\" as=\"school\" hint-placeholder-count=\"5\">\n              <div style=\"{{ school.style }}\" sc-camel-on-click=\"{{ school.onClick }}\">{{ school.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-right:6px;\">VIEW<\u002Fdiv>\n            <div style=\"{{ gridBtnStyle }}\" sc-camel-on-click=\"{{ setGridView }}\">GRID<\u002Fdiv>\n            <div style=\"{{ listBtnStyle }}\" sc-camel-on-click=\"{{ setListView }}\">LIST<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showExtraFilters }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"{{ extraFilterRowStyle }}\">\n            <sc-if value=\"{{ showNameFilter }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">NAME CONTAINS<\u002Fdiv>\n                <input value=\"{{ nameFilter }}\" sc-camel-on-change=\"{{ setNameFilter }}\" placeholder=\"e.g. van\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:8px 0;font-size:14px;font-family:inherit;outline:none;\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ showPeriodFilter }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"flex:1.4;min-width:0;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">PERIOD<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                  <sc-for list=\"{{ periodOptions }}\" as=\"opt\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ opt.style }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ showDateRange }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;\">\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">BORN BETWEEN<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;\">{{ bornFrom }}–{{ bornTo }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative;height:20px;\">\n                  <div style=\"position:absolute;top:9px;left:0;right:0;height:1px;background:var(--rule-4, rgba(28,28,26,0.3));\"><\u002Fdiv>\n                  <div style=\"{{ bornFillStyle }}\"><\u002Fdiv>\n                  <input class=\"range-thumb\" type=\"range\" min=\"1400\" max=\"1700\" step=\"10\" value=\"{{ bornFrom }}\" sc-camel-on-change=\"{{ setBornFrom }}\" style=\"position:absolute;top:0;left:0;width:100%;height:20px;margin:0;\">\n                  <input class=\"range-thumb\" type=\"range\" min=\"1400\" max=\"1700\" step=\"10\" value=\"{{ bornTo }}\" sc-camel-on-change=\"{{ setBornTo }}\" style=\"position:absolute;top:0;left:0;width:100%;height:20px;margin:0;\">\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--faint, #8a857c);margin-top:8px;\">\n                  <span>1400<\u002Fspan>\n                  <span>1700<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 28px;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--muted, #6B6660);\">{{ resultCount }}&nbsp;ARTISTS&nbsp;{{ activeFilterNote }}<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--accent, #003366);cursor:pointer;\" sc-camel-on-click=\"{{ toggleSort }}\">SORT: {{ sortLabel }} ↕<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isGridView }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"{{ artistsGridStyle }}\">\n            <sc-for list=\"{{ visibleArtists }}\" as=\"artist\" hint-placeholder-count=\"6\">\n              <div data-kbd-idx=\"{{ artist.kbdIdx }}\" tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ artist.cardStyle }}\" style-hover=\"opacity:0.68;\" sc-camel-on-click=\"{{ artist.onClick }}\">\n                <span style=\"{{ artist.caretStyle }}\">▸<\u002Fspan>\n                <div style=\"aspect-ratio:1;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:12px;margin-bottom:14px;position:relative;overflow:hidden;\">\n                  <div style=\"{{ artist.imgStyle }}\"><\u002Fdiv>\n                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;\">PORTRAIT — {{ artist.name }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:17px;font-weight:600;margin-bottom:4px;\">{{ artist.name }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);line-height:1.6;\">{{ artist.dates }}<br>{{ artist.school }} · {{ artist.period }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isListView }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"{{ listHeadStyle }}\">\n              <div>NAME<\u002Fdiv>\n              <div>DATES<\u002Fdiv>\n              <div>SCHOOL<\u002Fdiv>\n              <div>PERIOD<\u002Fdiv>\n              <div>FORM<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ visibleArtists }}\" as=\"artist\" hint-placeholder-count=\"8\">\n              <div data-kbd-idx=\"{{ artist.kbdIdx }}\" tabindex=\"0\" role=\"button\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ artist.rowStyle }}\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ artist.onClick }}\">\n                <span style=\"{{ artist.caretStyle }}\">▸<\u002Fspan>\n                <div style=\"font-size:15px;font-weight:600;\">{{ artist.name }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--text-2, #4a463f);\">{{ artist.dates }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--text-2, #4a463f);\">{{ artist.school }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--text-2, #4a463f);\">{{ artist.period }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--text-2, #4a463f);\">{{ artist.form }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ artistsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:56px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <div style=\"font-size:18px;font-weight:600;margin-bottom:8px;\">No artists match these filters.<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);margin-bottom:16px;max-width:380px;\">Widen the birth-year range or clear the school and period filters — the index is uneven across periods.<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ resetArtistFilters }}\">RESET FILTERS →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ artistsPaged }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--muted, #6B6660);\">PAGE 1 OF {{ artistPages }}<\u002Fdiv>\n            <div style=\"display:flex;gap:14px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1px;\">\n              <div style=\"color:var(--faint-2, #9c968c);\">← PREV<\u002Fdiv>\n              <div style=\"{{ artistNextStyle }}\">NEXT →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ARTIST PAGE ================= -->\n    <sc-if value=\"{{ isArtist }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Artist Page\" style=\"{{ pageEnterTightStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:32px;\">\n          <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToArtists }}\">ARTISTS<\u002Fspan>&nbsp;&nbsp;/&nbsp;&nbsp;DUTCH SCHOOL&nbsp;&nbsp;/&nbsp;&nbsp;VERMEER\n        <\u002Fdiv>\n\n        <div style=\"{{ artistHeadStyle }}\">\n          <div style=\"flex:1;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">02&nbsp;—&nbsp;ARTIST<\u002Fdiv>\n            <h1 style=\"{{ artistTitleStyle }}\">Johannes Vermeer<\u002Fh1>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;letter-spacing:1px;color:var(--accent, #003366);\">1632–1675 · DUTCH SCHOOL · BAROQUE<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:200px;flex-shrink:0;\">\n            <div style=\"aspect-ratio:1;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:10px;\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);\">PORTRAIT — VERMEER<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ artistLayoutStyle }}\">\n          <div style=\"width:300px;flex-shrink:0;\">\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">BORN<\u002Fspan>\n                <span style=\"font-size:14px;\">Delft, 1632<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">DIED<\u002Fspan>\n                <span style=\"font-size:14px;\">Delft, 1675<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">FORMS<\u002Fspan>\n                <span style=\"font-size:14px;\">Painting<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">IN ARCHIVE<\u002Fspan>\n                <span style=\"font-size:14px;\">36 works<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"{{ musicRowStyle }}\">\n              <div style=\"{{ playBtnStyle }}\" sc-camel-on-click=\"{{ toggleMusic }}\">{{ playGlyph }}<\u002Fdiv>\n              <div>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:3px;\">PERIOD MUSIC<\u002Fdiv>\n                <div style=\"font-size:13px;\">Sweelinck — Fantasia chromatica<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">BIOGRAPHY<\u002Fdiv>\n            <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0 0 18px;max-width:620px;\">Vermeer worked slowly and in relative obscurity, producing a small, tightly controlled body of work prized for its quiet domestic subjects and its restrained <span style=\"{{ tipChiaroscuro.style }}\" sc-camel-on-mouse-enter=\"{{ tipChiaroscuro.enter }}\" sc-camel-on-mouse-leave=\"{{ tipChiaroscuro.leave }}\">chiaroscuro<sc-if value=\"{{ tipChiaroscuro.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tooltipStyle }}\"><span style=\"{{ tooltipLabelStyle }}\">GLOSSARY · CHIAROSCURO<\u002Fspan>{{ tipChiaroscuro.definition }}<\u002Fspan><\u002Fsc-if><\u002Fspan>. He spent his entire life in Delft, where he also traded in the work of other painters.<\u002Fp>\n            <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0 0 44px;max-width:620px;\">Fewer than forty paintings are securely attributed to him. His reputation was rebuilt in the nineteenth century, when critics recognised in his interiors an unusually disciplined approach to composition, light and colour — closer to observation than to the <span style=\"{{ tipTenebrism.style }}\" sc-camel-on-mouse-enter=\"{{ tipTenebrism.enter }}\" sc-camel-on-mouse-leave=\"{{ tipTenebrism.leave }}\">tenebrism<sc-if value=\"{{ tipTenebrism.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tooltipStyle }}\"><span style=\"{{ tooltipLabelStyle }}\">GLOSSARY · TENEBRISM<\u002Fspan>{{ tipTenebrism.definition }}<\u002Fspan><\u002Fsc-if><\u002Fspan> of his southern contemporaries.<\u002Fp>\n\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:18px;margin-bottom:20px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">WORKS&nbsp;IN&nbsp;ARCHIVE&nbsp;(8&nbsp;OF&nbsp;36)<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\">SHOW ALL →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ worksGridStyle }}\">\n              <sc-for list=\"{{ works }}\" as=\"work\" hint-placeholder-count=\"8\">\n                <div style=\"{{ cardStyle }}\" style-hover=\"opacity:0.68;\" sc-camel-on-click=\"{{ goToArtwork }}\">\n                  <div style=\"aspect-ratio:4/5;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:10px;margin-bottom:10px;position:relative;overflow:hidden;\">\n                    <div style=\"{{ work.imgStyle }}\"><\u002Fdiv>\n                    <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:0.5px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ work.title }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:14px;font-weight:600;line-height:1.3;\">{{ work.title }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-top:3px;\">{{ work.date }} · {{ work.location }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ citeBlockStyle }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">CITE&nbsp;THIS&nbsp;RECORD&nbsp;—&nbsp;BIBTEX<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:{{ citeArtist.copyColor }};cursor:pointer;\" sc-camel-on-click=\"{{ citeArtist.copy }}\">{{ citeArtist.copyLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <pre class=\"bibtex\" style=\"{{ citePreStyle }}\">{{ citeArtist.bibtex }}<\u002Fpre>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:12px;\">ACCESSED {{ citeToday }}. REPLACE THE AUTHOR FIELD WITH THE COMMENTARY AUTHOR WHERE ONE IS NAMED.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= ARTWORK PAGE ================= -->\n    <sc-if value=\"{{ isArtwork }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Artwork Page\" style=\"{{ pageEnterTightStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:32px;\">\n          <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToArtists }}\">ARTISTS<\u002Fspan>&nbsp;&nbsp;/&nbsp;&nbsp;<span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToArtist }}\">VERMEER<\u002Fspan>&nbsp;&nbsp;/&nbsp;&nbsp;GIRL WITH A PEARL EARRING\n        <\u002Fdiv>\n\n        <div style=\"{{ artworkLayoutStyle }}\">\n          <div style=\"{{ artworkImageWrapStyle }}\">\n            <div tabindex=\"0\" role=\"button\" aria-label=\"Open Girl with a Pearl Earring in the image viewer\" sc-camel-on-key-down=\"{{ onActivateKey }}\" style=\"{{ artworkImageStyle }}\" sc-camel-on-click=\"{{ openArtworkPlate }}\">\n              <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Johannes%20Vermeer%20(1632-1675)%20-%20The%20Girl%20With%20The%20Pearl%20Earring%20(1665).jpg?width=1400\" alt=\"Girl with a Pearl Earring\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;\">\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;text-align:center;\">Girl with a Pearl Earring<\u002Fspan>\n              <span style=\"position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 9px 6px 7px;background:var(--inv-bg, #1C1C1A);color:var(--inv-fg, #F4F2ED);pointer-events:none;\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 13 13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" aria-hidden=\"true\"><circle cx=\"5.4\" cy=\"5.4\" r=\"4\"><\u002Fcircle><path d=\"M8.4 8.4 L12 12\"><\u002Fpath><path d=\"M3.6 5.4h3.6M5.4 3.6v3.6\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.5px;\">CLICK TO ZOOM<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;\">\n              <div style=\"display:flex;gap:6px;align-items:center;\">\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-right:4px;\">IMAGE SIZE<\u002Fdiv>\n                <sc-for list=\"{{ imageSizes }}\" as=\"size\" hint-placeholder-count=\"3\">\n                  <div style=\"{{ size.style }}\" sc-camel-on-click=\"{{ size.onClick }}\">{{ size.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\">DOWNLOAD FOR STUDY ↓<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);margin-top:10px;\">{{ imageSizeCaption }} &nbsp;·&nbsp; WIKIMEDIA COMMONS, PUBLIC DOMAIN<\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;\">\n              <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:1px solid var(--accent, #003366);padding:13px 22px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ goToPostcardCompose }}\">SEND AS POSTCARD →<\u002Fbutton>\n              <button style=\"{{ artworkAddBtnStyle }}\" sc-camel-on-click=\"{{ addPearlToItinerary }}\">{{ artworkAddLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ artworkMetaWrapStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">03&nbsp;—&nbsp;ARTWORK<\u002Fdiv>\n            <h1 style=\"{{ artworkTitleStyle }}\">Girl with a Pearl Earring<\u002Fh1>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;color:var(--accent, #003366);margin-bottom:26px;cursor:pointer;\" sc-camel-on-click=\"{{ goToArtist }}\">JOHANNES VERMEER, c. 1665 →<\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">MEDIUM<\u002Fspan>\n                <span style=\"font-size:14px;\">Oil on canvas<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">DIMENSIONS<\u002Fspan>\n                <span style=\"font-size:14px;\">44.5 × 39 cm<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">TYPE<\u002Fspan>\n                <span style=\"font-size:14px;\">Portrait<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">LOCATION<\u002Fspan>\n                <span style=\"font-size:14px;\">Mauritshuis, The Hague<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">ACCESSION<\u002Fspan>\n                <span style=\"font-size:14px;\">Inv. 670<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">PALETTE<\u002Fspan>\n                <div style=\"display:flex;height:26px;width:100%;\">\n                  <sc-for list=\"{{ artworkPalette }}\" as=\"c\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ c.style }}\" title=\"{{ c.title }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:4px 14px;\">\ le=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:3px;\">PERIOD MUSIC<\u002Fdiv>\n                <div style=\"font-size:13px;\">Sweelinck — Fantasia chromatica<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ commentaryLayoutStyle }}\">\n          <div style=\"width:300px;flex-shrink:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">COMMENTARY<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:10px;\">UNDERLINED TERMS ARE DEFINED IN THE <span style=\"color:var(--accent, #003366);cursor:pointer;\" sc-camel-on-click=\"{{ goToGlossary }}\">GLOSSARY →<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width:620px;\">\n            <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0 0 16px;\">Rather than a portrait of a named sitter, this is a <span style=\"{{ tipTronie.style }}\" sc-camel-on-mouse-enter=\"{{ tipTronie.enter }}\" sc-camel-on-mouse-leave=\"{{ tipTronie.leave }}\">tronie<sc-if value=\"{{ tipTronie.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tooltipStyle }}\"><span style=\"{{ tooltipLabelStyle }}\">GLOSSARY · TRONIE<\u002Fspan>{{ tipTronie.definition }}<\u002Fspan><\u002Fsc-if><\u002Fspan> — a study of a head in costume. The figure turns out of the dark ground towards the viewer, lit from the left, with no setting or attributes to place her.<\u002Fp>\n            <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">The pearl is rendered with two strokes of white <span style=\"{{ tipImpasto.style }}\" sc-camel-on-mouse-enter=\"{{ tipImpasto.enter }}\" sc-camel-on-mouse-leave=\"{{ tipImpasto.leave }}\">impasto<sc-if value=\"{{ tipImpasto.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ tooltipStyle }}\"><span style=\"{{ tooltipLabelStyle }}\">GLOSSARY · IMPASTO<\u002Fspan>{{ tipImpasto.definition }}<\u002Fspan><\u002Fsc-if><\u002Fspan> over grey, and dissolves entirely at close range: an economy of means typical of Vermeer's late practice.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <div style=\"{{ citeBlockStyle }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">CITE&nbsp;THIS&nbsp;RECORD&nbsp;—&nbsp;BIBTEX<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:{{ citeArtwork.copyColor }};cursor:pointer;\" sc-camel-on-click=\"{{ citeArtwork.copy }}\">{{ citeArtwork.copyLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <pre class=\"bibtex\" style=\"{{ citePreStyle }}\">{{ citeArtwork.bibtex }}<\u002Fpre>\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;line-height:1.7;color:var(--faint, #8a857c);margin-top:12px;\">ACCESSED {{ citeToday }}. REPLACE THE AUTHOR FIELD WITH THE COMMENTARY AUTHOR WHERE ONE IS NAMED.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:56px;padding-top:18px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">{{ relatedHeading }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <sc-for list=\"{{ relatedBases }}\" a <main data-screen-label=\"Postcard Compose\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">04&nbsp;—&nbsp;POSTCARD&nbsp;SERVICE<\u002Fdiv>\n\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <h1 style=\"{{ resultsTitleStyle }}\">Send a postcard<\u002Fh1>\n            <p style=\"max-width:520px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 40px;\">Free service. The recipient receives a link to the artwork with your message; no account is needed and no address is stored after delivery.<\u002Fp>\n\n            <div style=\"{{ postcardLayoutStyle }}\">\n              <div style=\"width:260px;flex-shrink:0;\">\n                <div style=\"aspect-ratio:39/44.5;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:12px;margin-bottom:12px;position:relative;overflow:hidden;\">\n                  <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Johannes%20Vermeer%20(1632-1675)%20-%20The%20Girl%20With%20The%20Pearl%20Earring%20(1665).jpg?width=700\" alt=\"Girl with a Pearl Earring\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;\">\n                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:0.5px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — Girl with a Pearl Earring<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;\">Girl with a Pearl Earring<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);margin-top:3px;\">Johannes Vermeer, c. 1665<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:12px;\" sc-camel-on-click=\"{{ goToArtwork }}\">CHANGE ARTWORK →<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1;max-width:440px;\">\n                <div style=\"display:flex;gap:20px;margin-bottom:20px;\">\n                  <div style=\"flex:1;\">\n                    <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">YOUR NAME<\u002Flabel>\n                    <input value=\"{{ senderName }}\" sc-camel-on-change=\"{{ setSenderName }}\" placeholder=\"Jane Doe\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:10px 0;font-size:15px;font-family:inherit;outline:none;\">\n                  <\u002Fdiv>\n                  <div style=\"flex:1;\">\n                    <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">YOUR EMAIL<\u002Flabel>\n                    <input value=\"{{ senderEmail }}\" sc-camel-on-change=\"{{ setSenderEmail }}\" placeholder=\"jane@example.com\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:10px 0;font-size:15px;font-family:inherit;outline:none;\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-bottom:20px;\">\n                  <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">RECIPIENT EMAIL<\u002Flabel>\n                  <input value=\"{{ recipientEmail }}\" sc-camel-on-change=\"{{ setRecipientEmail }}\" placeholder=\"recipient@example.com\" style=\"width:100%;border:none;border-bottom:1px solid var(--ink, #1C1C1A);background:transparent;padding:10px 0;font-size:15px;font-family:inherit;outline:none;\">\n                <\u002Fdiv>\n                <div style=\"margin-bottom:24px;\">\n                  <label style=\"display:block;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:8px;\">MESSAGE — {{ charsLeft }} CHARACTERS LEFT<\u002Flabel>\n                  <textarea value=\"{{ message }}\" sc-camel-on-change=\"{{ setMessage }}\" placeholder=\"Write a short note…\" style=\"width:100%;border:1px solid var(--rule-4, rgba(28,28,26,0.3));background:transparent;padding:12px;font-size:15px;font-family:inherit;line-height:1.5;outline:none;min-height:110px;resize:vertical;\"><\u002Ftextarea>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--rule, rgba(28,28,26,0.14));border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));margin-bottom:24px;\">\n                  <div style=\"{{ musicTrackStyle }}\" sc-camel-on-click=\"{{ togglePostcardMusic }}\">\n                    <div style=\"{{ musicThumbStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:14px;\">Include period music — <span style=\"color:var(--muted, #6B6660);\">Sweelinck, Fantasia chromatica<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:none;padding:16px 28px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1.5px;cursor:pointer;width:100%;transition:background 0.16s ease,border-color 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ submitPostcard }}\">SEND POSTCARD →<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:460px;padding:40px 0 24px;\">\n            <div style=\"width:44px;height:44px;border:1.5px solid var(--accent, #003366);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;color:var(--accent, #003366);font-size:18px;margin-bottom:24px;\">✓<\u002Fdiv>\n            <h2 style=\"font-size:28px;font-weight:600;margin:0 0 12px;\">Postcard sent<\u002Fh2>\n            <p style=\"font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:0 0 8px;\">Delivered to <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px;\">{{ displayRecipient }}<\u002Fspan>. The link stays valid for 30 days.<\u002Fp>\n            <p style=\"font-size:15px;line-height:1.6;color:var(--muted, #6B6660);margin:0 0 28px;\">Below is what the recipient will see.<\u002Fp>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;\" sc-camel-on-click=\"{{ goToPostcardView }}\">VIEW THE POSTCARD →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= POSTCARD RECEIVED ================= -->\n    <sc-if value=\"{{ isPostcardView }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Postcard Received\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">05&nbsp;—&nbsp;POSTCARD&nbsp;RECEIVED<\u002Fdiv>\n        <h1 style=\"{{ postcardTitleStyle }}\">You have received a postcard<\u002Fh1>\n\n        <div style=\"max-width:700px;border:1px solid var(--rule, rgba(28,28,26,0.14));background:var(--surface, #FBFAF7);\">\n          <div style=\"background:var(--fill, #E4E0D7);aspect-ratio:16/9;display:flex;align-items:flex-end;padding:16px;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));position:relative;overflow:hidden;\">\n            <img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Johannes%20Vermeer%20(1632-1675)%20-%20The%20Girl%20With%20The%20Pearl%20Earring%20(1665).jpg?width=900\" alt=\"Girl with a Pearl Earring\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;\">\n            <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — Girl with a Pearl Earring, oil on canvas<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"{{ postcardBackStyle }}\">\n            <div style=\"flex:1;padding-right:24px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:10px;\">FROM {{ displaySender }}<\u002Fdiv>\n              <div style=\"font-size:17px;line-height:1.6;color:var(--text, #2a2822);\">{{ displayMessage }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ postcardStampStyle }}\">\n              <div style=\"font-size:15px;font-weight:600;line-height:1.3;margin-bottom:4px;\">Girl with a Pearl Earring<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);line-height:1.6;\">Johannes Vermeer, c. 1665<br>Oil on canvas, 44.5 × 39 cm<br>Mauritshuis, The Hague<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:14px;\" sc-camel-on-click=\"{{ goToArtwork }}\">VIEW IN GALLERY →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n            <div style=\"{{ playBtnStyle }}\" sc-camel-on-click=\"{{ toggleMusic }}\">{{ playGlyph }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">PERIOD MUSIC — SWEELINCK, FANTASIA CHROMATICA<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:24px;margin-top:28px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;letter-spacing:1px;\">\n          <div style=\"color:var(--accent, #003366);cursor:pointer;\" sc-camel-on-click=\"{{ goToPostcardCompose }}\">SEND YOUR OWN →<\u002Fdiv>\n          <div style=\"color:var(--accent, #003366);cursor:pointer;\" sc-camel-on-click=\"{{ goToArtists }}\">BROWSE THE ARCHIVE →<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= GENERAL STATIC CONTENT ================= -->\n    <sc-if value=\"{{ isStatic }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"General Static Content\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">06&nbsp;—&nbsp;GENERAL&nbsp;CONTENT<\u002Fdiv>\n        <h1 style=\"{{ docTitleStyle }}\">Privacy Policy<\u002Fh1>\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);margin-bottom:44px;\">LAST UPDATED 12 MARCH 2026 · APPROX. 3 MIN READ<\u002Fdiv>\n\n        <div style=\"{{ staticLayoutStyle }}\">\n          <div style=\"{{ docNavStyle }}\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:14px;\">CONTENTS<\u002Fdiv>\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:var(--accent, #003366);\">01 · Data we collect<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:var(--text-2, #4a463f);\">02 · Cookies<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:var(--text-2, #4a463f);\">03 · The postcard service<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:var(--text-2, #4a463f);\">04 · Images and copyright<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:var(--text-2, #4a463f);\">05 · Your rights<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;padding:10px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));color:var(--text-2, #4a463f);\">06 · Contact<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"max-width:600px;\">\n            <p style=\"font-size:17px;line-height:1.65;color:var(--text, #2a2822);margin:0 0 40px;\">The Web Gallery of Art is run as a non-commercial educational archive. We collect the minimum needed to keep it working, and nothing for advertising.<\u002Fp>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;margin-bottom:36px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">01 · DATA WE COLLECT<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">Aggregate usage statistics — pages viewed, search terms, approximate country — used to decide which parts of the archive to expand. No profiles are built and no data is sold.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;margin-bottom:36px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">02 · COOKIES<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">A small number of essential cookies remember your session, preferred image size and whether period music is enabled. No advertising or cross-site tracking cookies are set.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;margin-bottom:36px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">03 · THE POSTCARD SERVICE<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">Sender and recipient addresses are used once, to deliver the postcard, and are deleted with the message when the link expires after 30 days. Addresses are never added to a mailing list.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;margin-bottom:36px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">04 · IMAGES AND COPYRIGHT<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">The archive is copyrighted as a database. Images and documents may be used for educational and personal purposes only; redistribution requires the permission of the rights holder of the reproduction.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;margin-bottom:36px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">05 · YOUR RIGHTS<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">You may request a copy of, or the deletion of, any personal data we hold. Requests are answered within 30 days.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"border-top:1px solid var(--rule, rgba(28,28,26,0.14));padding-top:24px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:10px;\">06 · CONTACT<\u002Fdiv>\n              <p style=\"font-size:16px;line-height:1.7;color:var(--text, #2a2822);margin:0;\">Write to privacy@wga.hu. For questions about a specific reproduction, use the enquiry form on the artwork page.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= TIMELINE EXPLORER ================= -->\n    <sc-if value=\"{{ isTimeline }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Timeline Explorer\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">19&nbsp;—&nbsp;TIMELINE&nbsp;EXPLORER<\u002Fdiv>\n        <div style=\"{{ itinHeadStyle }}\">\n          <div style=\"flex:1;min-width:0;\">\n            <h1 style=\"{{ pageTitleFlushStyle }}\">Timeline<\u002Fh1>\n            <p style=\"max-width:600px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:14px 0 0;\">Set a window of years and read across it: who was alive and working, what was dated to those years, which movements were current, what was being built, what was happening outside the studio, and what was being sung. Click any bar for the detail.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"{{ tlWindowBoxStyle }}\">\n            <div style=\"{{ tlNudgeStyle }}\" style-hover=\"opacity:0.55;\" sc-camel-on-click=\"{{ tlShiftBack }}\">←<\u002Fdiv>\n            <div>\n              <div style=\"{{ tlBigRangeStyle }}\">{{ tlRangeLabel }}<\u002Fdiv>\n              <div style=\"{{ tlSmallMetaStyle }}\">{{ tlSpanLabel }}&nbsp;·&nbsp;{{ tlHitLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ tlNudgeStyle }}\" style-hover=\"opacity:0.55;\" sc-camel-on-click=\"{{ tlShiftFwd }}\">→<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;\">\n          <sc-for list=\"{{ tlPresets }}\" as=\"p\" hint-placeholder-count=\"7\">\n            <div style=\"{{ p.style }}\" sc-camel-on-click=\"{{ p.onClick }}\">{{ p.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;height:44px;margin-bottom:6px;\">\n          <div style=\"position:absolute;left:0;right:0;top:0;height:44px;border:1px solid var(--rule, rgba(28,28,26,0.14));background:var(--surface-2, #EFEDE6);overflow:hidden;\">\n            <sc-for list=\"{{ tlDensity }}\" as=\"d\" hint-placeholder-count=\"50\">\n              <div style=\"{{ d.style }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"{{ tlBrushStyle }}\"><\u002Fdiv>\n          <input class=\"range-brush\" type=\"range\" min=\"1300\" max=\"1800\" step=\"5\" value=\"{{ tlFrom }}\" sc-camel-on-change=\"{{ setTlFrom }}\" style=\"position:absolute;top:0;left:0;width:100%;height:44px;margin:0;z-index:3;\">\n          <input class=\"range-brush\" type=\"range\" min=\"1300\" max=\"1800\" step=\"5\" value=\"{{ tlTo }}\" sc-camel-on-change=\"{{ setTlTo }}\" style=\"position:absolute;top:0;left:0;width:100%;height:44px;margin:0;z-index:4;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;letter-spacing:1px;color:var(--faint, #8a857c);margin-bottom:6px;\">\n          <sc-for list=\"{{ tlOverviewTicks }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <span>{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;letter-spacing:1.5px;color:var(--faint, #8a857c);margin-bottom:34px;\">DRAG&nbsp;EITHER&nbsp;HANDLE&nbsp;·&nbsp;BARS&nbsp;SHOW&nbsp;CATALOGUE&nbsp;DENSITY&nbsp;PER&nbsp;DECADE<\u002Fdiv>\n\n        <div style=\"{{ tlLaneGridStyle }}\">\n          <sc-for list=\"{{ tlLaneCells }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"{{ c.style }}\" sc-camel-on-click=\"{{ c.onClick }}\">\n              <div style=\"font-size:26px;font-weight:600;letter-spacing:-0.5px;\">{{ c.count }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-top:6px;\">{{ c.label }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);margin-top:3px;\">{{ c.state }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;\">\n          <sc-for list=\"{{ tlKey }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:7px;\">\n              <div style=\"{{ k.swatchStyle }}\"><\u002Fdiv>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1.2px;color:var(--muted, #6B6660);\">{{ k.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ tlChartWrapStyle }}\">\n          <sc-for list=\"{{ tlBands }}\" as=\"b\" hint-placeholder-count=\"5\">\n            <div style=\"{{ b.style }}\">\n              <span style=\"{{ b.labelStyle }}\">{{ b.label }}<\u002Fspan>\n              <span style=\"{{ b.countStyle }}\">{{ b.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ tlRowLabels }}\" as=\"r\" hint-placeholder-count=\"14\">\n            <div style=\"{{ r.style }}\">\n              <span style=\"{{ r.nameStyle }}\">{{ r.name }}<\u002Fspan>\n              <span style=\"{{ r.metaStyle }}\">{{ r.meta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"{{ tlPlotStyle }}\">\n            <sc-for list=\"{{ tlGrid }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"{{ g.style }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ tlEventLines }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <div style=\"{{ e.style }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ tlMarks }}\" as=\"m\" hint-placeholder-count=\"40\">\n              <div style=\"{{ m.style }}\" title=\"{{ m.title }}\" sc-camel-on-click=\"{{ m.onClick }}\"><span style=\"{{ m.labelStyle }}\">{{ m.label }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"{{ tlAxisStyle }}\">\n            <sc-for list=\"{{ tlAxis }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <div style=\"{{ a.style }}\">{{ a.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tlHasSel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px solid var(--rule-3, rgba(28,28,26,0.25));padding:22px 24px;margin-bottom:44px;max-width:760px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:20px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">{{ tlSelKind }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--faint, #8a857c);cursor:pointer;\" style-hover=\"color:var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ tlClearSel }}\">CLOSE&nbsp;✕<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:600;margin:10px 0 6px;letter-spacing:-0.2px;\">{{ tlSelTitle }}<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);margin-bottom:14px;\">{{ tlSelMeta }}<\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.7;color:var(--text, #2a2822);margin:0;text-wrap:pretty;\">{{ tlSelBody }}<\u002Fp>\n            <sc-if value=\"{{ tlSelHasLink }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;transition:opacity 0.16s ease;margin-top:16px;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ tlSelGo }}\">{{ tlSelLink }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ tlNoSel }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;letter-spacing:1.2px;color:var(--faint, #8a857c);margin-bottom:44px;\">CLICK&nbsp;A&nbsp;BAR,&nbsp;A&nbsp;DIAMOND&nbsp;OR&nbsp;AN&nbsp;EVENT&nbsp;TO&nbsp;READ&nbsp;IT&nbsp;HERE<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"{{ tlPanelStyle }}\">\n          <div style=\"min-width:0;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);\">WORKS&nbsp;IN&nbsp;THIS&nbsp;WINDOW<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ tlWorkCountLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ tlWorksGridStyle }}\">\n              <sc-for list=\"{{ tlWorks }}\" as=\"w\" hint-placeholder-count=\"8\">\n                <div style=\"{{ cardStyle }}\" style-hover=\"opacity:0.68;\" sc-camel-on-click=\"{{ w.onClick }}\">\n                  <div style=\"aspect-ratio:4/5;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:9px;margin-bottom:9px;position:relative;overflow:hidden;\">\n                    <div style=\"{{ w.imgStyle }}\"><\u002Fdiv>\n                    <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:8.5px;letter-spacing:0.5px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ w.title }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13.5px;font-weight:600;line-height:1.3;\">{{ w.title }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--muted, #6B6660);margin-top:3px;\">{{ w.artist }}&nbsp;·&nbsp;{{ w.date }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ tlHasMoreWorks }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);margin-top:16px;\">{{ tlWorksMore }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;\">\n              <button style=\"background:var(--accent-bg, #003366);color:var(--inv-fg, #F4F2ED);border:none;padding:14px 20px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:background 0.16s ease;\" style-hover=\"background:var(--accent-bg-2, #00264d);\" sc-camel-on-click=\"{{ tlSendToSearch }}\">OPEN THIS WINDOW IN ARTWORK SEARCH →<\u002Fbutton>\n              <button style=\"background:transparent;color:var(--ink, #1C1C1A);border:1px solid var(--rule-4, rgba(28,28,26,0.3));padding:14px 20px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;cursor:pointer;transition:border-color 0.16s ease;\" style-hover=\"border:1px solid var(--ink, #1C1C1A);\" sc-camel-on-click=\"{{ goToItinBuild }}\">BUILD AN ITINERARY →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ tlSubPanelStyle }}\">\n          <div style=\"min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:18px;\">PLACES<\u002Fdiv>\n            <sc-for list=\"{{ tlPlaces }}\" as=\"pl\" hint-placeholder-count=\"6\">\n              <div style=\"padding:11px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;\">\n                  <span style=\"font-size:14px;\">{{ pl.name }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted, #6B6660);\">{{ pl.count }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"{{ pl.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"font-size:13px;line-height:1.65;color:var(--muted, #6B6660);margin:14px 0 0;\">Counted from artists working and buildings under construction inside the window.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"min-width:0;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:18px;\">MUSIC FROM THIS PERIOD<\u002Fdiv>\n            <sc-for list=\"{{ tlMusicList }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule, rgba(28,28,26,0.14));\">\n                <div style=\"min-width:0;\">\n                  <div style=\"font-size:14px;font-weight:600;line-height:1.35;\">{{ m.piece }}<\u002Fdiv>\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--muted, #6B6660);margin-top:4px;\">{{ m.composer }}&nbsp;·&nbsp;{{ m.year }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:opacity 0.16s ease;\" style-hover=\"opacity:0.6;\" sc-camel-on-click=\"{{ m.onClick }}\">{{ m.playLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);margin-top:14px;\">{{ tlPlayingLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= GUIDED TOURS ================= -->\n    <sc-if value=\"{{ isGuidedTours }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Guided Tours\" style=\"{{ pageEnterStyle }}\">\n        <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:2px;color:var(--muted, #6B6660);margin-bottom:10px;\">20&nbsp;—&nbsp;GUIDED&nbsp;TOURS<\u002Fdiv>\n        <h1 style=\"{{ pageTitleStyle }}\">Guided Tours<\u002Fh1>\n        <p style=\"max-width:620px;font-size:16px;line-height:1.6;color:var(--text-2, #4a463f);margin:14px 0 0;\">Long routes through the collection, written by the editors and kept in revision. A tour is a piece of writing with the collection attached to it — chapters, artist lists, sub-tours and a bibliography — and it is maintained here for as long as the collection stands. For sequences put together by visitors, see <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToItineraries }}\">Itineraries<\u002Fspan>.<\u002Fp>\n\n        <div style=\"{{ itinRulesStyle }}\">\n          <sc-for list=\"{{ gtFacts }}\" as=\"fact\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:7px;\">{{ fact.label }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.55;color:var(--text, #2a2822);\">{{ fact.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ gtChipRowStyle }}\">\n          <sc-for list=\"{{ gtKindChips }}\" as=\"chip\" hint-placeholder-count=\"5\">\n            <div style=\"{{ chip.style }}\" sc-camel-on-click=\"{{ chip.onClick }}\">{{ chip.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ gtFeaturedStyle }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink, #1C1C1A);margin-bottom:30px;\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">REBUILT&nbsp;PAGE&nbsp;BY&nbsp;PAGE<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ gtCount }}&nbsp;TOURS&nbsp;PUBLISHED<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ gtFeaturedGridStyle }}\">\n            <sc-for list=\"{{ gtFeatured }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <div style=\"cursor:pointer;\" sc-camel-on-click=\"{{ t.onClick }}\">\n                <div style=\"aspect-ratio:4/3;background:var(--fill, #E4E0D7);border:1px solid var(--rule, rgba(28,28,26,0.14));display:flex;align-items:flex-end;padding:11px;position:relative;overflow:hidden;margin-bottom:15px;\">\n                  <div style=\"{{ t.imgStyle }}\"><\u002Fdiv>\n                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ t.title }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:10px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:9px;\">\n                  <span>{{ t.kind }}&nbsp;·&nbsp;#{{ t.no }}<\u002Fspan>\n                  <span style=\"color:var(--faint, #8a857c);\">{{ t.revised }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:20px;font-weight:600;line-height:1.22;margin-bottom:8px;text-wrap:pretty;\">{{ t.title }}<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.6;color:var(--text-2, #4a463f);margin-bottom:10px;\">{{ t.blurb }}<\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--accent, #003366);\">{{ t.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ gtSeriesStyle }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink, #1C1C1A);\">\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">THE&nbsp;REST&nbsp;OF&nbsp;THE&nbsp;SERIES<\u002Fdiv>\n            <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ gtSeriesCount }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ gtSeries }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"{{ t.rowStyle }}\" style-hover=\"background:var(--accent-tint, rgba(0,51,102,0.05));\" sc-camel-on-click=\"{{ t.onClick }}\">\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1px;color:var(--muted, #6B6660);\">{{ t.no }}<\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:17px;font-weight:600;line-height:1.3;\">{{ t.title }}<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.55;color:var(--muted, #6B6660);margin-top:4px;\">{{ t.blurb }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-2, #4a463f);\">{{ t.kind }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--faint, #8a857c);\">{{ t.revised }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsc-if>\n\n    <!-- ================= WALKING ONE GUIDED TOUR ================= -->\n    <sc-if value=\"{{ isGuidedTour }}\" hint-placeholder-val=\"{{ false }}\">\n      <main data-screen-label=\"Guided Tour\" style=\"{{ pageEnterTightStyle }}\">\n        <div style=\"{{ gtBarStyle }}\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;min-width:0;\">\n            <span style=\"cursor:pointer;color:var(--accent, #003366);\" sc-camel-on-click=\"{{ goToGuidedTours }}\">GUIDED&nbsp;TOURS<\u002Fspan>\n            <span style=\"color:var(--faint, #8a857c);\">&nbsp;&nbsp;/&nbsp;&nbsp;<\u002Fspan>\n            <span>{{ gtNo }}<\u002Fspan>\n            <span style=\"color:var(--faint, #8a857c);\">&nbsp;&nbsp;/&nbsp;&nbsp;<\u002Fspan>\n            <span style=\"color:var(--muted, #6B6660);\">{{ gtSectionLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:20px;align-items:baseline;\">\n            <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1px;color:var(--faint, #8a857c);\">{{ gtKeyHint }}<\u002Fspan>\n            <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;\">{{ gtPos }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:2px;background:var(--rule, rgba(28,28,26,0.14));\">\n          <div style=\"{{ gtProgressStyle }}\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ gtLayoutStyle }}\">\n          <aside style=\"{{ gtRailStyle }}\">\n            <div style=\"{{ gtRailHeadStyle }}\" sc-camel-on-click=\"{{ gtRailToggle }}\">\n              <span>CONTENTS<\u002Fspan>\n              <span>{{ gtRailCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ gtRailListStyle }}\">\n              <sc-for list=\"{{ gtRail }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div style=\"{{ r.style }}\" style-hover=\"color:var(--accent, #003366);\" sc-camel-on-click=\"{{ r.onClick }}\">\n                  <span style=\"{{ r.numStyle }}\">{{ r.num }}<\u002Fspan>\n                  <span style=\"{{ r.labelStyle }}\">{{ r.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Faside>\n\n          <div style=\"{{ gtBodyStyle }}\">\n\n            <!-- title page -->\n            <sc-if value=\"{{ gtIsTitle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <div style=\"{{ gtTitlePlateStyle }}\">\n                  <div style=\"{{ gtCoverStyle }}\"><\u002Fdiv>\n                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:1px;color:var(--faint, #8a857c);text-transform:uppercase;\">IMAGE — {{ gtCoverLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">{{ gtKindLabel }}&nbsp;·&nbsp;{{ gtNo }}<\u002Fdiv>\n                <h1 style=\"{{ pageTitleFlushStyle }}\">{{ gtTitle }}<\u002Fh1>\n                <p style=\"font-size:18px;line-height:1.62;color:var(--text-2, #4a463f);margin:18px 0 0;max-width:60ch;text-wrap:pretty;\">{{ gtBlurb }}<\u002Fp>\n                <div style=\"{{ gtMetaGridStyle }}\">\n                  <sc-for list=\"{{ gtMeta }}\" as=\"mrow\" hint-placeholder-count=\"4\">\n                    <div>\n                      <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:6px;\">{{ mrow.label }}<\u002Fdiv>\n                      <div style=\"font-size:14px;line-height:1.5;color:var(--text, #2a2822);\">{{ mrow.value }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"{{ gtUnbuiltStyle }}\">\n                  <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:1.5px;color:var(--muted, #6B6660);margin-bottom:12px;\">STILL IN ITS ORIGINAL LAYOUT<\u002Fdiv>\n                  <p style=\"font-size:16px;line-height:1.72;color:var(--text, #2a2822);margin:0 0 26px;\">Th
